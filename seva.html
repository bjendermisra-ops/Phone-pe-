<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F7931E">
    <title>Seva Offerings - ISKCON Bhuvaikuntha</title>
    
    <!-- Fast Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cinzel:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 🎨 Official Figma Color Tokens */
            --primary: #F7931E; 
            --primary-dark: #E07E0D;
            --primary-90: #F89E34;
            --primary-75: #FAB45B;
            --primary-50: #FDC98E;
            --primary-25: #FEE4C6;
            --primary-15: #FFF0DE;
            --primary-5: #FFF9F3;
            
            --text-500: #1A202C;
            --text-90: #2D3748;
            --text-75: #4A5568;
            --text-50: #718096;
            --text-25: #A0AEC0;
            --text-15: #CBD5E0;
            --text-5: #E2E8F0;

            --bg-color: #FBF9F5; 
            --card-bg: #FFFFFF; 
            --border-color: #EAE6DF;
            --nav-dark: #1E242B;
            
            --success-color: #22C55E;
            --warning-color: #F59E0B;
            --error-color: #EF4444;

            --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            --orange-shadow: 0 6px 18px rgba(247, 147, 30, 0.22);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-500); 
            margin: 0; 
            padding: 0; 
            padding-bottom: 90px; 
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .figma-header { 
            background-color: var(--primary); 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 14px 16px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 2px 10px rgba(247, 147, 30, 0.2); 
        }
        .back-btn { 
            color: white; 
            font-size: 1.15rem; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 36px; height: 36px;
            border-radius: 50%;
            transition: var(--transition); 
        }
        .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
        .header-title { font-size: 1.1rem; font-weight: 700; margin: 0; }
        .header-bell-btn { color: white; font-size: 1.15rem; background: none; border: none; cursor: pointer; }

        .tabs-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 10px; 
            background: #FFFFFF; 
            padding: 12px 16px; 
            margin-bottom: 14px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.03); 
            scrollbar-width: none; 
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-pill { 
            padding: 7px 18px; 
            border-radius: 25px; 
            border: 1px solid var(--border-color); 
            background: #FFFFFF; 
            font-weight: 700; 
            font-size: 13px; 
            cursor: pointer; 
            color: var(--text-75); 
            white-space: nowrap; 
            transition: var(--transition); 
        }
        .tab-pill.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary);
            box-shadow: var(--orange-shadow);
        }

        .feed-container { max-width: 540px; margin: 0 auto; padding: 0 14px; box-sizing: border-box; }
        .seva-card { 
            background: white; 
            border-radius: 16px; 
            margin-bottom: 18px; 
            box-shadow: var(--card-shadow); 
            overflow: hidden; 
            border: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            transition: var(--transition);
        }
        .seva-card:active { transform: scale(0.99); }
        .seva-img { 
            width: 100%; 
            height: 190px; 
            object-fit: cover; 
            object-position: center;
        }
        .seva-info { padding: 15px; text-align: left; }
        .seva-title { font-size: 16px; font-weight: 800; color: var(--text-500); margin: 0 0 6px 0; }
        .seva-desc { font-size: 13px; color: var(--text-75); line-height: 1.45; margin-bottom: 14px; font-weight: 500; }
        
        .donate-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
        .figma-btn { 
            flex: 1; 
            padding: 11px 18px; 
            background: var(--primary); 
            color: white !important; 
            border: none; 
            border-radius: 25px; 
            font-weight: 700; 
            font-size: 14px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            box-shadow: var(--orange-shadow);
            transition: var(--transition); 
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .figma-btn:active { transform: scale(0.96); }
        .price-tag { font-size: 15px; font-weight: 800; color: var(--primary-dark); white-space: nowrap; }

        /* ================= 💳 DETAILED SEVA BOTTOM SHEET ================= */
        .bottom-sheet-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.55); 
            z-index: 1000; 
            display: flex; 
            align-items: flex-end; 
            justify-content: center; 
            opacity: 0; visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .bottom-sheet-overlay.show { opacity: 1; visibility: visible; }
        
        .bottom-sheet-card { 
            background: white; 
            border-top-left-radius: 24px; 
            border-top-right-radius: 24px; 
            width: 100%; 
            max-width: 520px; 
            padding: 20px 18px 28px 18px; 
            max-height: 90vh; 
            overflow-y: auto; 
            box-sizing: border-box; 
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .bottom-sheet-overlay.show .bottom-sheet-card { transform: translateY(0); }
        
        .sheet-grabber {
            width: 42px; height: 4px; background: #CBD5E0;
            border-radius: 2px; margin: 0 auto 16px auto;
        }

        .amount-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        .amount-pill {
            padding: 10px 6px;
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-500);
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .amount-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(247, 147, 30, 0.25);
        }

        .custom-amount-input {
            width: 100%;
            padding: 12px 14px;
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-500);
            outline: none;
            margin-bottom: 16px;
            box-sizing: border-box;
            transition: var(--transition);
        }
        .custom-amount-input:focus {
            border-color: var(--primary);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px var(--primary-15);
        }

        .form-label { display: block; text-align: left; font-weight: 700; font-size: 12px; margin-bottom: 5px; color: var(--text-75); text-transform: uppercase; }
        .figma-input { 
            width: 100%; 
            padding: 11px 14px; 
            margin-bottom: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 14px; 
            font-weight: 600;
            color: var(--text-500);
            outline: none; 
            background: #F8FAFC;
            transition: var(--transition); 
        }
        .figma-input:focus { 
            border-color: var(--primary); 
            background: #FFFFFF;
            box-shadow: 0 0 0 3px var(--primary-15); 
        }
        .figma-input[readonly] { background-color: #F1F5F9; color: var(--text-50); }

        .error-msg { color: var(--error-color); font-size: 11px; font-weight: 600; text-align: left; margin-top: -8px; margin-bottom: 10px; display: block; }
        .input-error { border-color: var(--error-color) !important; }

        .checkbox-container { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px 0; cursor: pointer; text-align: left; }
        .checkbox-container input { width: 18px; height: 18px; accent-color: var(--primary); }
        .checkbox-container label { margin: 0; font-size: 13px; color: var(--text-500); font-weight: 600; }
        .tax-subtext { font-size: 11px; color: var(--text-50); text-align: left; margin-bottom: 12px; }

        .bottom-bar { 
            position: fixed; 
            bottom: 0; left: 0; 
            width: 100%; 
            background: white; 
            padding: 12px 16px; 
            box-shadow: 0 -4px 16px rgba(0,0,0,0.06); 
            display: flex; 
            justify-content: center; 
            z-index: 500; 
            box-sizing: border-box;
        }
        .live-btn { 
            background: var(--nav-dark); 
            color: white; 
            border: none; 
            padding: 11px 26px; 
            border-radius: 25px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 13px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.2); 
            transition: var(--transition); 
        }
        .live-btn:active { transform: scale(0.97); }
        .live-pulse-dot { 
            width: 9px; height: 9px; 
            background-color: var(--success-color); 
            border-radius: 50%; 
            display: inline-block; 
            animation: pulseGreen 1.6s infinite; 
        }
        @keyframes pulseGreen { 
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 
            70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); } 
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } 
        }

        .donation-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); align-items: center; }
        .donor-name { font-weight: 700; font-size: 14px; color: var(--text-500); margin-bottom: 2px; }
        .donor-time { font-size: 11px; color: var(--text-50); }
        .donor-amt { font-weight: 800; color: var(--success-color); font-size: 15px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 📱 Top Header Bar -->
    <header class="figma-header">
        <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
        <h1 class="header-title">Seva Offerings</h1>
        <button class="header-bell-btn" onclick="window.location.href='notifications.html';"><i class="far fa-bell"></i></button>
    </header>

    <!-- Category Tabs -->
    <div class="tabs-container" id="category-tabs">
        <button class="tab-pill active" onclick="switchCategory('Temple Seva', this)">Temple</button>
        <button class="tab-pill" onclick="switchCategory('Annadan', this)">Annadan</button>
        <button class="tab-pill" onclick="switchCategory('Gau Seva', this)">Gau Seva</button>
        <button class="tab-pill" onclick="switchCategory('Deity Seva', this)">Deity Seva</button>
        <button class="tab-pill" onclick="switchCategory('Special Puja', this)">Special Puja</button>
    </div>

    <!-- Seva Feed List -->
    <div class="feed-container" id="seva-feed-list"></div>

    <!-- Floating Live Donations Bar -->
    <div class="bottom-bar">
        <button class="live-btn" onclick="openLiveDonationsModal()">
            <span class="live-pulse-dot"></span> View Live Donations
        </button>
    </div>

    <!-- ================= 1. DETAILED SEVA SELECTION DRAWER ================= -->
    <div id="detailed-seva-modal" class="bottom-sheet-overlay" onclick="closeDetailedModal(event)">
        <div class="bottom-sheet-card" onclick="event.stopPropagation()">
            <div class="sheet-grabber"></div>
            
            <div style="display: flex; gap: 14px; margin-bottom: 16px; align-items: center;">
                <img id="detail-seva-img" src="images/qa_temple_seva.webp" style="width: 80px; height: 80px; border-radius: 12px; object-fit: cover;">
                <div>
                    <h3 id="detail-seva-title" style="margin: 0 0 4px 0; font-size: 16px; font-weight: 800; color: var(--text-500);">Seva Title</h3>
                    <p id="detail-seva-desc" style="margin: 0; font-size: 12px; color: var(--text-75); line-height: 1.35;">Seva description...</p>
                </div>
            </div>

            <p style="font-size: 12px; font-weight: 700; color: var(--text-75); margin: 0 0 8px 0;">Please select your donation amount:</p>
            
            <!-- Amount Selection Grid -->
            <div class="amount-grid">
                <div class="amount-pill active" onclick="selectPresetAmount(2001, this)">₹2,001</div>
                <div class="amount-pill" onclick="selectPresetAmount(4001, this)">₹4,001</div>
                <div class="amount-pill" onclick="selectPresetAmount(6001, this)">₹6,001</div>
                <div class="amount-pill" onclick="selectPresetAmount(8001, this)">₹8,001</div>
                <div class="amount-pill" onclick="selectPresetAmount(10001, this)">₹10,001</div>
                <div class="amount-pill" onclick="selectPresetAmount(12001, this)">₹12,001</div>
            </div>

            <input type="number" id="customAmountInput" class="custom-amount-input" placeholder="Or enter other amount (₹)" oninput="onCustomAmountChange(this.value)">

            <button class="figma-btn w-100" style="width: 100%;" onclick="openDonorInfoSheet()">
                DONATE NOW <i class="fas fa-heart ms-1"></i>
            </button>
        </div>
    </div>

    <!-- ================= 2. DONOR INFORMATION BOTTOM SHEET ================= -->
    <div id="donor-modal" class="bottom-sheet-overlay" onclick="closeDonorModal(event)">
        <div class="bottom-sheet-card" onclick="event.stopPropagation()">
            <div class="sheet-grabber"></div>
            
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 style="font-size: 16px; font-weight: 800; margin: 0; color: var(--text-500);">Donor Information</h4>
                <button onclick="closeModal('donor-modal')" style="background:none; border:none; color:var(--text-50); font-size: 1.2rem; cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>

            <form onsubmit="initiateSevaPayment(event)">
                <label class="form-label">Full Name *</label>
                <input type="text" id="donor-name" class="figma-input" placeholder="Enter Full Name" required>
                <span id="error-name" class="error-msg hidden"></span>

                <label class="form-label">Mobile Number *</label>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <input type="text" value="+91" style="width: 55px; text-align: center; margin: 0;" class="figma-input" readonly>
                    <input type="tel" id="donor-phone" class="figma-input" placeholder="10-digit Mobile Number" style="flex: 1; margin: 0;" required pattern="[0-9]{10}" oninput="this.value=this.value.replace(/\D/g,'')">
                </div>
                <span id="error-phone" class="error-msg hidden"></span>

                <label class="form-label">Email Address</label>
                <input type="email" id="donor-email" class="figma-input" placeholder="devotee@iskcon.com">

                <!-- 10BE Tax Exemption Checkbox -->
                <div class="checkbox-container">
                    <input type="checkbox" id="tax-benefit" onchange="toggleTaxFields(this.checked)">
                    <label for="tax-benefit">I Want 10 BE (Income Tax Benefit) receipts</label>
                </div>
                <div class="tax-subtext">Get tax-deductible receipts for all your donations under section 10BE</div>

                <!-- Tax Fields -->
                <div id="tax-fields" class="hidden">
                    <label class="form-label">PAN Number *</label>
                    <input type="text" id="pan-number" class="figma-input" style="text-transform:uppercase;" placeholder="ABCDE1234F">
                    <span id="error-pan" class="error-msg hidden"></span>
                    
                    <label class="form-label">Address *</label>
                    <input type="text" id="address" class="figma-input" placeholder="Flat / Street / Area">
                    <span id="error-address" class="error-msg hidden"></span>
                    
                    <div style="display: flex; gap: 10px;">
                        <div style="flex: 1;">
                            <label class="form-label">City *</label>
                            <input type="text" id="city" class="figma-input" placeholder="City">
                        </div>
                        <div style="flex: 1;">
                            <label class="form-label">PIN Code *</label>
                            <input type="text" id="pincode" class="figma-input" placeholder="Pincode" maxlength="6" oninput="this.value=this.value.replace(/\D/g,'')">
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: -8px;">
                        <div style="flex: 1;"><span id="error-city" class="error-msg hidden"></span></div>
                        <div style="flex: 1;"><span id="error-pincode" class="error-msg hidden"></span></div>
                    </div>

                    <label class="form-label">State *</label>
                    <input type="text" id="state" class="figma-input" placeholder="Maharashtra">
                    <span id="error-state" class="error-msg hidden"></span>
                </div>

                <button type="submit" class="figma-btn w-100 mt-2" style="width: 100%;" id="pay-btn">
                    Pay Now <span id="btnPayAmount">₹2,001</span>
                </button>
            </form>
        </div>
    </div>

    <!-- ================= 3. LIVE DONATIONS MODAL ================= -->
    <div id="live-modal" class="bottom-sheet-overlay" onclick="closeModal('live-modal')">
        <div class="bottom-sheet-card" onclick="event.stopPropagation()">
            <div class="sheet-grabber"></div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 style="font-size: 16px; font-weight: 800; margin: 0; color: var(--text-500);">Recent Live Donations</h4>
                <button onclick="closeModal('live-modal')" style="background:none; border:none; color:var(--text-50); font-size: 1.2rem; cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <div id="live-donations-list" style="max-height: 55vh; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        // 1. FIREBASE SETUP
        const firebaseConfig = {
            apiKey: "AIzaSyAHksBlu9ue2p7AxXuUKALmEws5mscO908",
            authDomain: "iskcon-bhuvaikuntha.firebaseapp.com",
            projectId: "iskcon-bhuvaikuntha"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 2. SEVA CATALOG DATA
        const sevaData = [
            // Temple Seva
            { id: "square_feet_seva", category: "Temple Seva", title: "Square Feet Seva", desc: "Every square foot you sponsor creates a holy space where devotees will pray, sing, & connect with Krishna.", amount: 5001, img: "images/campaign_sqft.webp" },
            { id: "bricks_seva", category: "Temple Seva", title: "Bricks Seva", desc: "Every brick you donate strengthens the walls of Lord Krishna's home. Your offering becomes eternal sacred merit.", amount: 2001, img: "images/campaign_bricks.webp" },
            { id: "cement_bag_seva", category: "Temple Seva", title: "Sponsor Cement Seva", desc: "By sponsoring cement, you provide the strong foundation that keeps the temple safe for generations to come.", amount: 2001, img: "images/slider_cement.webp" },
            { id: "sand_seva", category: "Temple Seva", title: "Sponsor Sand Seva", desc: "Each handful of sacred sand forms the holy groundwork where millions will bow in reverence.", amount: 2001, img: "images/qa_temple_seva.webp" },
            
            // Annadan
            { id: "nitya_annadan", category: "Annadan", title: "Anna Dān Seva", desc: "Feed hungry pilgrims and devotees with love. Your prasadam brings smiles to thousands of souls daily.", amount: 2001, img: "images/qa_annadan_seva.webp" },
            { id: "sadhu_bhojan", category: "Annadan", title: "Sadhu Bhojan Seva", desc: "Feed sacred Vaishnavas and Sadhus who dedicate their entire lives to chanting and serving the Lord.", amount: 3501, img: "images/qa_annadan_seva.webp" },
            { id: "festival_feast", category: "Annadan", title: "Festival Feast Sponsorship", desc: "Sponsor grand prasadam on holy festival days like Janmashtami, Ekadashi, and Radhashtami.", amount: 5001, img: "images/slider_annadan.webp" },

            // Gau Seva
            { id: "gau_poshan", category: "Gau Seva", title: "Cow Care & Feeding (Gau Poshana)", desc: "Feed and protect holy cows daily. Serving Gomata brings immense auspiciousness to your entire family.", amount: 1501, img: "images/qa_go_seva.webp" },
            { id: "gau_chikitsa", category: "Gau Seva", title: "Cow Medical Care (Gau Chikitsa)", desc: "Support emergency medical care, routine health check-ups, and medicines for injured and aged cows.", amount: 2501, img: "images/qa_go_seva.webp" },

            // Deity Seva
            { id: "mangala_aarti", category: "Deity Seva", title: "Mangala Aarti Seva", desc: "Sponsor the sacred morning worship (4:30 AM) where Lord Krishna receives his first offerings of the day.", amount: 1001, img: "images/qa_deity_seva.webp" },
            { id: "deity_dress", category: "Deity Seva", title: "Deity Dress Seva", desc: "Sponsor new silk outfits and divine ornaments for Sri Sri Radha Pandharinath.", amount: 5001, img: "images/qa_deity_seva.webp" },
            { id: "raja_bhoga", category: "Deity Seva", title: "Raja Bhoga Seva (12:00 PM)", desc: "Sponsor the royal midday feast offering honoring Krishna as the Supreme Lord of the universe.", amount: 3101, img: "images/qa_deity_seva.webp" },

            // Special Puja
            { id: "tulsi_archana", category: "Special Puja", title: "Special Tulsi Archana", desc: "Offer 1008 Tulsi leaves at the lotus feet of Krishna for good health, peace, and spiritual protection.", amount: 2501, img: "images/qa_special_puja.webp" },
            { id: "narasimha_yagna", category: "Special Puja", title: "Special Narasimha Yagna", desc: "Invoke the fierce protection of Lord Narasimhadeva for removing obstacles and warding off negativity.", amount: 2501, img: "images/qa_special_puja.webp" }
        ];

        let currentActiveCategory = "Temple Seva";
        let selectedSevaObject = null;
        let selectedAmount = 2001;
        let globalLiveDonations = [];

        // 3. SMART DEEP LINK PARSER & AUTO-FILL
        window.addEventListener('DOMContentLoaded', () => {
            parseUrlParametersAndRoute();
            startLiveDonationsListener();
            setupInputSecurityListeners();
            fetchAndAutoFillUserProfile();
        });

        function parseUrlParametersAndRoute() {
            const urlParams = new URLSearchParams(window.location.search);
            const catParam = urlParams.get('cat');
            const idParam = urlParams.get('id');

            if (catParam) {
                currentActiveCategory = catParam;
                document.querySelectorAll('.tab-pill').forEach(pill => {
                    const text = pill.innerText.trim();
                    if (text === catParam || (catParam === 'Temple Seva' && text === 'Temple') || (catParam === 'Gau Seva' && text === 'Gau Seva')) {
                        document.querySelectorAll('.tab-pill').forEach(t => t.classList.remove('active'));
                        pill.classList.add('active');
                    }
                });
            }

            renderSevaFeed();

            // Auto Open Specific Seva Modal if id is passed in URL
            if (idParam) {
                setTimeout(() => {
                    openDetailedModal(idParam);
                }, 300);
            }
        }

        async function fetchAndAutoFillUserProfile() {
            const rawPhone = localStorage.getItem("userPhone");
            if (!rawPhone || rawPhone === "Guest") return;

            const cleanPhone = String(rawPhone).replace(/\D/g, '').slice(-10);
            const phoneInput = document.getElementById('donor-phone');
            if (phoneInput) phoneInput.value = cleanPhone;

            const cachedProfile = localStorage.getItem("devoteeProfile");
            if (cachedProfile) {
                try {
                    const data = JSON.parse(cachedProfile);
                    if (data.name) document.getElementById('donor-name').value = data.name;
                    if (data.email) document.getElementById('donor-email').value = data.email;
                    if (data.pan) document.getElementById('pan-number').value = data.pan;
                    if (data.address) document.getElementById('address').value = data.address;
                    if (data.city) document.getElementById('city').value = data.city;
                    if (data.state) document.getElementById('state').value = data.state;
                    if (data.pincode) document.getElementById('pincode').value = data.pincode;
                } catch(e){}
            }

            try {
                const userDoc = await db.collection("users").doc(cleanPhone).get();
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    if (userData.name) document.getElementById('donor-name').value = userData.name;
                    if (userData.email) document.getElementById('donor-email').value = userData.email;
                    if (userData.pan) document.getElementById('pan-number').value = userData.pan;
                    if (userData.address) document.getElementById('address').value = userData.address;
                    if (userData.city) document.getElementById('city').value = userData.city;
                    if (userData.state) document.getElementById('state').value = userData.state;
                    if (userData.pincode) document.getElementById('pincode').value = userData.pincode;
                }
            } catch (err) {}
        }

        function setupInputSecurityListeners() {
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('input-error');
                    const errorEl = document.getElementById('error-' + input.id.split('-')[1]);
                    if (errorEl) errorEl.classList.add('hidden');
                });
            });

            document.getElementById('donor-name').addEventListener('input', e => e.target.value = e.target.value.replace(/[^a-zA-Z\s]/g, '').slice(0, 50));
            document.getElementById('donor-phone').addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10));
            document.getElementById('pan-number').addEventListener('input', e => e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10));
            document.getElementById('pincode').addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6));
        }

        function setFieldError(inputId, errorId, isValid, errorMessage) {
            const inputEl = document.getElementById(inputId), errorEl = document.getElementById(errorId);
            if (!isValid) { 
                inputEl.classList.add('input-error'); 
                errorEl.innerText = errorMessage; 
                errorEl.classList.remove('hidden'); 
            }
        }

        function switchCategory(category, element) {
            currentActiveCategory = category;
            document.querySelectorAll('.tab-pill').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            renderSevaFeed();
        }

        function renderSevaFeed() {
            const container = document.getElementById('seva-feed-list');
            container.innerHTML = '';
            const filteredList = sevaData.filter(s => s.category === currentActiveCategory);

            if (filteredList.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 35px; color: var(--text-50); font-weight:700;">No offerings available in this category!</div>'; 
                return;
            }

            filteredList.forEach(item => {
                container.innerHTML += `
                    <div class="seva-card">
                        <img class="seva-img" src="${item.img}" alt="${item.title}" onerror="this.src='images/default_avatar.webp'">
                        <div class="seva-info">
                            <h3 class="seva-title">${item.title}</h3>
                            <div class="seva-desc">${item.desc}</div>
                            <div class="donate-row">
                                <button class="figma-btn" onclick="openDetailedModal('${item.id}')">DONATE ❤</button>
                                <div class="price-tag">₹${item.amount.toLocaleString('en-IN')}/-</div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // ================= DETAILED SEVA & AMOUNT FLOW =================
        function openDetailedModal(sevaId) {
            selectedSevaObject = sevaData.find(s => s.id === sevaId);
            if (!selectedSevaObject) return;

            document.getElementById('detail-seva-title').innerText = selectedSevaObject.title;
            document.getElementById('detail-seva-desc').innerText = selectedSevaObject.desc;
            document.getElementById('detail-seva-img').src = selectedSevaObject.img;
            
            selectedAmount = selectedSevaObject.amount;
            document.getElementById('customAmountInput').value = '';
            
            document.querySelectorAll('.amount-pill').forEach(pill => {
                const val = parseInt(pill.innerText.replace(/\D/g, ''));
                pill.classList.toggle('active', val === selectedAmount);
            });

            document.getElementById('btnPayAmount').innerText = '₹' + selectedAmount.toLocaleString('en-IN');
            document.getElementById('detailed-seva-modal').classList.add('show');
        }

        function closeDetailedModal(e) {
            if (e && e.target !== document.getElementById('detailed-seva-modal') && e !== null) return;
            document.getElementById('detailed-seva-modal').classList.remove('show');
        }

        function selectPresetAmount(amt, el) {
            selectedAmount = amt;
            document.getElementById('customAmountInput').value = '';
            document.querySelectorAll('.amount-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('btnPayAmount').innerText = '₹' + selectedAmount.toLocaleString('en-IN');
        }

        function onCustomAmountChange(val) {
            const num = parseFloat(val);
            if (num && num > 0) {
                selectedAmount = num;
                document.querySelectorAll('.amount-pill').forEach(p => p.classList.remove('active'));
                document.getElementById('btnPayAmount').innerText = '₹' + selectedAmount.toLocaleString('en-IN');
            }
        }

        function openDonorInfoSheet() {
            closeDetailedModal(null);
            document.getElementById('donor-modal').classList.add('show');
        }

        function closeDonorModal(e) {
            if (e && e.target !== document.getElementById('donor-modal') && e !== null) return;
            document.getElementById('donor-modal').classList.remove('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
            if (id === 'donor-modal') {
                document.getElementById('tax-benefit').checked = false;
                toggleTaxFields(false);
                document.querySelectorAll('.error-msg').forEach(e => e.classList.add('hidden'));
                document.querySelectorAll('input').forEach(e => e.classList.remove('input-error'));
            }
        }

        function toggleTaxFields(checked) {
            const taxFields = document.getElementById('tax-fields');
            const inputs = taxFields.querySelectorAll('input');
            if (checked) { 
                taxFields.classList.remove('hidden'); 
                inputs.forEach(i => i.required = true); 
            } else { 
                taxFields.classList.add('hidden'); 
                inputs.forEach(i => i.required = false); 
            }
        }

        // ================= 4. PAYMENT GATEWAY INITIATION =================
        async function initiateSevaPayment(e) {
            e.preventDefault();
            const name = document.getElementById('donor-name').value.trim();
            const phone = document.getElementById('donor-phone').value.trim().replace(/\D/g, '');
            const email = document.getElementById('donor-email').value.trim();
            const isTaxRequired = document.getElementById('tax-benefit').checked;
            
            let hasError = false;

            if (name.length < 3) { 
                setFieldError('donor-name', 'error-name', false, "Please enter your full name"); 
                hasError = true; 
            }
            if (phone.length !== 10) { 
                setFieldError('donor-phone', 'error-phone', false, "Please enter a valid 10-digit mobile number"); 
                hasError = true; 
            }
            
            let finalPan = '', finalAddress = '';
            if (isTaxRequired) {
                finalPan = document.getElementById('pan-number').value.toUpperCase().trim();
                const addr = document.getElementById('address').value.trim();
                const city = document.getElementById('city').value.trim();
                const state = document.getElementById('state').value.trim();
                const pin = document.getElementById('pincode').value.trim();

                if (!/^[A-Z]{5}[0-9]{4}[A-Z]{1}$/.test(finalPan)) { 
                    setFieldError('pan-number', 'error-pan', false, "Invalid PAN Format (e.g. ABCDE1234F)"); 
                    hasError = true; 
                }
                if (addr.length < 4) { 
                    setFieldError('address', 'error-address', false, "Please enter address"); 
                    hasError = true; 
                }
                if (city.length < 2) { 
                    setFieldError('city', 'error-city', false, "Please enter city"); 
                    hasError = true; 
                }
                if (pin.length !== 6) { 
                    setFieldError('pincode', 'error-pincode', false, "Please enter valid 6-digit PIN code"); 
                    hasError = true; 
                }
                
                finalAddress = `${addr}, ${city}, ${state} - ${pin}, India`;
            }

            if (hasError) return;

            const payBtn = document.getElementById('pay-btn');
            payBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Connecting Securely...';
            payBtn.disabled = true;

            try {
                const apiBase = "https://phone-pe-pi.vercel.app";
                const returnAppUrl = window.location.origin + "/index.html";
                
                const response = await fetch(`${apiBase}/api/create-link`, { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        amount: selectedAmount,
                        phone: "91" + phone,
                        email: email,
                        seva: selectedSevaObject ? selectedSevaObject.title : 'General Seva',
                        pan: finalPan,
                        address: finalAddress,
                        returnUrl: returnAppUrl 
                    })
                });

                const data = await response.json();
                
                if (data.payment_url) {
                    window.location.href = data.payment_url;
                } else {
                    alert('Gateway Notice: ' + (data.error || 'Payment gateway is generating your session.'));
                    payBtn.innerHTML = `Pay Now ₹${selectedAmount.toLocaleString('en-IN')}`;
                    payBtn.disabled = false;
                }
            } catch (err) {
                console.error("Payment error:", err);
                alert('Connection Error. Please check your internet and try again.');
                payBtn.innerHTML = `Pay Now ₹${selectedAmount.toLocaleString('en-IN')}`;
                payBtn.disabled = false;
            }
        }

        // ================= 5. LIVE DONATIONS FEED =================
        function startLiveDonationsListener() {
            db.collection("donations").orderBy("date", "desc").limit(30).onSnapshot((snapshot) => {
                globalLiveDonations = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    let dateVal = data.date ? (data.date.toDate ? data.date.toDate() : new Date(data.date)).toLocaleString('en-IN', { 
                        timeZone: 'Asia/Kolkata', 
                        day: '2-digit', 
                        month: 'short', 
                        year: 'numeric' 
                    }) : '';
                    if (data.amount && Number(data.amount) > 0) {
                        globalLiveDonations.push({ name: data.name || 'Devotee', amount: data.amount, date: dateVal });
                    }
                });
            }, (err) => {});
        }

        function openLiveDonationsModal() {
            const container = document.getElementById('live-donations-list'); 
            container.innerHTML = '';
            if (globalLiveDonations.length === 0) { 
                container.innerHTML = `<div style="text-align:center; padding: 25px; color: var(--text-50); font-weight:700;">No donations recorded yet!</div>`; 
            } else {
                globalLiveDonations.forEach(item => {
                    container.innerHTML += `
                        <div class="donation-item">
                            <div>
                                <div class="donor-name">${item.name}</div>
                                <div class="donor-time">${item.date}</div>
                            </div>
                            <div class="donor-amt">₹${Number(item.amount).toLocaleString('en-IN')}</div>
                        </div>`;
                });
            }
            document.getElementById('live-modal').classList.add('show');
        }
    </script>
