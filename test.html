<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp API Debugger</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #FF7B00; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        pre { background: #222; color: #0f0; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🛠️ WhatsApp Error Checker</h2>
        <p>Apna number daalein aur check karein ki DoubleTick kyu fail ho raha hai:</p>
        
        <label>WhatsApp Number:</label>
        <input type="text" id="phone" value="9561160799" placeholder="Enter 10 digit number">
        
        <button id="sendBtn" onclick="testWhatsApp()">Test WhatsApp Message</button>
        
        <h3 style="margin-top: 20px;">API Response (Error/Success):</h3>
        <!-- Yahan par exact error chhap jayega -->
        <pre id="result">Result yahan aayega...</pre>
    </div>

    <script>
        async function testWhatsApp() {
            const btn = document.getElementById('sendBtn');
            const resDiv = document.getElementById('result');
            const phone = document.getElementById('phone').value;
            
            btn.innerText = "Sending Request to Vercel...";
            btn.disabled = true;
            resDiv.innerText = "Waiting for response from DoubleTick...\n\n";

            try {
                // Aapke Vercel server ko call laga rahe hain
                const response = await fetch("https://phone-pe-pi.vercel.app/api/send-whatsapp-receipt", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        phone: phone,
                        transactionId: "TXN" + Date.now(),
                        name: "Test Devotee",
                        amount: "501",
                        seva: "Gau Seva"
                    })
                });
                
                const data = await response.json();
                
                // Result screen par print kar diya
                resDiv.innerText = JSON.stringify(data, null, 4);
                
                if(response.ok) {
                    resDiv.style.color = "#0f0"; // Green for success
                } else {
                    resDiv.style.color = "#ff4d4d"; // Red for error
                }
            } catch(err) {
                resDiv.innerText = "Network Error: " + err.message;
                resDiv.style.color = "#ff4d4d";
            }
            
            btn.innerText = "Test WhatsApp Message";
            btn.disabled = false;
        }
    </script>
</body>
</html>
