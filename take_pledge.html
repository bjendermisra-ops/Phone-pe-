<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pledge Seva - ISKCON Bhuvaikuntha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #F7931E; --primary-dark: #E07E0D; --bg: #FDFBF7; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; padding-bottom: 40px; color: #1A202C; }
        .app-header { background: var(--primary); color: white; padding: 14px 16px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; }
        .back-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; padding-right: 10px; }
        .header-title { font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 800; margin: 0; }
        .form-card { background: white; border-radius: 16px; padding: 20px 16px; margin: 16px 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(247,147,30,0.15); }
        .pledge-label { font-size: 0.78rem; font-weight: 700; color: #4A5568; margin-bottom: 6px; text-transform: uppercase; }
        .pledge-input { width: 100%; padding: 11px 14px; border: 1px solid #CBD5E0; border-radius: 10px; font-size: 0.9rem; margin-bottom: 14px; outline: none; }
        .submit-btn { background: var(--primary); color: white; border: none; width: 100%; padding: 13px; border-radius: 10px; font-weight: 800; font-size: 0.95rem; cursor: pointer; }
    </style>
</head>
<body>
    <header class="app-header">
        <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
        <h1 class="header-title">Monthly Pledge Seva</h1>
    </header>

    <div class="container-fluid px-0">
        <div class="form-card">
            <h4 style="font-family:'Cinzel', serif; font-weight:800; margin-bottom:12px;">Sankalpa Pledge Form</h4>
            <p style="font-size:0.82rem; color:#718096; line-height:1.5;">Take a sacred pledge to support Sri Sri Radha Pandharinath temple construction on a regular monthly basis.</p>
            
            <form onsubmit="event.preventDefault(); alert('Hare Krishna! Your Sankalpa pledge has been recorded.'); window.location.href='seva.html';">
                <label class="pledge-label">Devotee Legal / Spiritual Name *</label>
                <input type="text" class="pledge-input" required placeholder="e.g. Radheshyam Das">

                <label class="pledge-label">WhatsApp Contact Number *</label>
                <input type="tel" class="pledge-input" required placeholder="10-digit mobile number">

                <label class="pledge-label">Choose Monthly Pledge Seva *</label>
                <select class="pledge-input" required>
                    <option value="500">₹500 / Month - Nitya Seva</option>
                    <option value="1100">₹1,100 / Month - Sadhu Seva</option>
                    <option value="2100">₹2,100 / Month - Anna Daan Seva</option>
                    <option value="5000">₹5,000 / Month - Temple Brick Seva</option>
                </select>

                <label class="pledge-label">Gotra (For Sankalpa Prayers)</label>
                <input type="text" class="pledge-input" placeholder="e.g. Kashyap">

                <button type="submit" class="submit-btn"><i class="fas fa-hands-praying me-1"></i> Submit Pledge & Proceed to Seva</button>
            </form>
        </div>
    </div>
</body>
</html>
