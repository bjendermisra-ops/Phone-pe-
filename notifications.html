<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F7931E">
    <title>Notification Center - ISKCON Bhuvaikuntha</title>

    <!-- Fast Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Cinzel:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 🎨 Official Figma Color Tokens */
            --primary: #F7931E; 
            --primary-dark: #E07E0D;
            --primary-90: #F89E34;
            --primary-75: #FAB45B;
            --primary-50: #FDC98E;
            --primary-25: #FEE4C6;
            --primary-15: #FFF0DE;
            --primary-5: #FFF9F3;
            
            --text-500: #1A202C;
            --text-90: #2D3748;
            --text-75: #4A5568;
            --text-50: #718096;
            --text-25: #A0AEC0;
            --text-15: #CBD5E0;
            --text-5: #E2E8F0;

            --bg-color: #FFFFFF; 
            --card-bg: #FFFFFF; 
            --border-color: #EAE6DF;
            --card-border: 1px solid #EAE6DF;
            
            --success-color: #22C55E;
            --warning-color: #F59E0B;
            --error-color: #EF4444;

            --orange-shadow: 0 4px 12px rgba(247, 147, 30, 0.25);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] { 
            --bg-color: #0E1217; 
            --card-bg: #181D24; 
            --text-500: #F7FAFC;
            --text-90: #EDF2F7;
            --text-75: #E2E8F0;
            --text-50: #CBD5E0;
            --border-color: #2D3748;
            --card-border: 1px solid #2D3748;
            --primary-15: #2A1D0F;
            --primary-5: #1F150A;
        }

        body { 
            background-color: var(--bg-color); 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            color: var(--text-500); 
            margin: 0; 
            padding: 0; 
            padding-bottom: 40px; 
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        a { text-decoration: none; color: inherit; }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        /* 📱 Top Header Bar */
        .figma-header { 
            background-color: var(--primary); 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 14px 16px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 2px 10px rgba(247, 147, 30, 0.2); 
        }
        .back-btn { 
            color: white; 
            font-size: 1.15rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 36px; height: 36px;
            border-radius: 50%;
            transition: var(--transition); 
        }
        .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
        
        .header-title { 
            font-size: 1.1rem; 
            font-weight: 700; 
            margin: 0; 
            flex-grow: 1; 
            text-align: center;
        }

        .header-action-btn {
            background: transparent;
            border: none;
            color: #FFFFFF;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .header-action-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
        }

        /* 🌟 GURU VANI vs TEMPLE FILTER TABS */
        .filter-tabs-bar {
            max-width: 540px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-tabs-bar::-webkit-scrollbar { display: none; }
        
        .filter-pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: #F8FAFC;
            color: var(--text-75);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: var(--transition);
        }
        .filter-pill.active {
            background: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(247, 147, 30, 0.3);
        }

        /* Sub-bar Info */
        .notif-sub-bar {
            max-width: 540px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: var(--primary-5);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.74rem;
            font-weight: 700;
        }
        .notif-count-badge {
            color: var(--primary-dark);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .mark-read-text-btn {
            color: var(--primary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition);
        }
        .mark-read-text-btn:hover {
            color: var(--primary-dark);
        }

        /* 🔔 Notification Feed Container */
        .notification-feed {
            max-width: 540px;
            margin: 0 auto;
            background: var(--card-bg);
            min-height: calc(100vh - 160px);
        }

        .notif-card {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
            position: relative;
            cursor: pointer;
        }
        .notif-card:active {
            background-color: var(--primary-5);
        }

        /* Distinct Golden Accent for Maharaj / Guru Vani */
        .notif-card.is-guru {
            background: linear-gradient(90deg, rgba(254, 243, 199, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
            border-left: 3.5px solid #F59E0B;
        }

        /* Unread State Highlight */
        .notif-card.unread {
            background-color: rgba(247, 147, 30, 0.05);
        }
        .unread-indicator-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            position: absolute;
            top: 16px;
            right: 14px;
            box-shadow: 0 0 8px rgba(247, 147, 30, 0.8);
        }

        .notif-avatar-box {
            flex-shrink: 0;
            position: relative;
        }
        .notif-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid var(--border-color);
            background: var(--primary-15);
        }

        .notif-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding-right: 10px;
        }

        /* Category Tag Badges */
        .notif-tag {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 4px;
            width: fit-content;
        }
        .tag-guru {
            background: #FEF3C7;
            color: #B45309;
            border: 1px solid #FDE68A;
        }
        .tag-temple {
            background: var(--primary-15);
            color: var(--primary-dark);
            border: 1px solid var(--primary-25);
        }

        .notif-title {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--text-500);
            margin: 0 0 3px 0;
            line-height: 1.3;
        }
        [data-theme="dark"] .notif-title { color: var(--primary-75); }

        .notif-desc {
            font-size: 0.79rem;
            color: var(--text-75);
            margin: 0 0 8px 0;
            line-height: 1.45;
            font-weight: 500;
            word-break: break-word;
        }

        /* 🖼️ Production Ready Notification Banner Image Preview */
        .notif-media-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin: 4px 0 10px 0;
            border: 1px solid var(--border-color);
            background: var(--primary-5);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: relative;
        }
        .notif-media-container img {
            width: 100%;
            max-height: 190px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .notif-action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 2px;
        }

        /* Figma Action Button */
        .notif-btn {
            background: var(--primary);
            color: #FFFFFF !important;
            padding: 6px 16px;
            font-size: 0.72rem;
            font-weight: 700;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--orange-shadow);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-transform: capitalize;
        }
        .notif-btn:active { transform: scale(0.95); }

        .notif-time {
            font-size: 0.7rem;
            color: var(--text-25);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }
        .empty-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: var(--primary-15);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 16px auto;
            border: 1.5px solid var(--primary-25);
        }

        .loader-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--primary);
        }

        /* 🔍 Lightbox / Full-screen Image Modal */
        .img-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.88);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .img-modal-overlay.active {
            display: flex;
        }
        .img-modal-content {
            max-width: 96%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: zoomIn 0.25s ease-out;
        }
        .img-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #FFFFFF;
            font-size: 1.6rem;
            background: rgba(255,255,255,0.2);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 📱 Top Header Bar -->
    <header class="figma-header">
        <a href="index.html" class="back-btn" aria-label="Go Back"><i class="fas fa-chevron-left"></i></a>
        <h1 class="header-title">Notification Center</h1>
        <button class="header-action-btn" id="markAllReadBtn" title="Mark All as Read" onclick="markAllNotificationsAsRead()">
            <i class="fas fa-check-double"></i>
        </button>
    </header>

    <!-- 👑 Filter Tabs (All / Guru Vani / Temple Broadcast) -->
    <div class="filter-tabs-bar">
        <div class="filter-pill active" id="tabAll" onclick="setFilterMode('ALL')">
            <i class="fas fa-bell"></i> All Updates
        </div>
        <div class="filter-pill" id="tabGuru" onclick="setFilterMode('GURU')">
            <i class="fas fa-crown text-warning"></i> Guru Vani (महाराज)
        </div>
        <div class="filter-pill" id="tabTemple" onclick="setFilterMode('TEMPLE')">
            <i class="fas fa-gopuram text-primary"></i> Temple Broadcast
        </div>
    </div>

    <!-- Sub-bar Info -->
    <div class="notif-sub-bar">
        <span class="notif-count-badge" id="notifBadgeCount">
            <i class="fas fa-bell"></i> Loading...
        </span>
        <span class="mark-read-text-btn" onclick="refreshNotifications()">
            <i class="fas fa-rotate"></i> Refresh
        </span>
    </div>

    <!-- Notification Feed Container -->
    <div class="notification-feed" id="notification-list">
        <div class="loader-box">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p style="font-size: 0.8rem; font-weight: 700; margin-top: 10px; color: var(--text-50);">Loading sacred updates...</p>
        </div>
    </div>

    <!-- 🔍 Image Zoom Modal -->
    <div class="img-modal-overlay" id="imageModal" onclick="closeImageModal()">
        <button class="img-modal-close" onclick="closeImageModal()"><i class="fas fa-times"></i></button>
        <img src="" alt="Notification Media" id="modalImage" class="img-modal-content" onclick="event.stopPropagation()">
    </div>

    <script>
        // 1. FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyAHksBlu9ue2p7AxXuUKALmEws5mscO908",
            authDomain: "iskcon-bhuvaikuntha.firebaseapp.com",
            projectId: "iskcon-bhuvaikuntha"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 2. DEVICE INSTALL TIME STORAGE (Filters out prehistoric mock clutter)
        function getDeviceInstallTimestamp() {
            const STORAGE_KEY = "iskcon_bhuvaikuntha_device_install_time";
            let installTime = localStorage.getItem(STORAGE_KEY);
            if (!installTime) {
                installTime = Date.now().toString();
                localStorage.setItem(STORAGE_KEY, installTime);
            }
            return parseInt(installTime, 10);
        }

        // 3. READ / UNREAD STATUS LOCAL STORAGE
        function getReadNotificationIds() {
            try {
                return JSON.parse(localStorage.getItem("bhuvaikuntha_read_notifs") || "[]");
            } catch (e) {
                return [];
            }
        }

        function markNotificationAsRead(notifId) {
            if (!notifId) return;
            let readIds = getReadNotificationIds();
            if (!readIds.includes(notifId)) {
                readIds.push(notifId);
                localStorage.setItem("bhuvaikuntha_read_notifs", JSON.stringify(readIds));
            }
        }

        function markAllNotificationsAsRead() {
            if (window.masterNotificationPool && window.masterNotificationPool.length > 0) {
                const readIds = window.masterNotificationPool.map(n => n.id);
                localStorage.setItem("bhuvaikuntha_read_notifs", JSON.stringify(readIds));
                if (navigator.vibrate) navigator.vibrate(30);
                filterAndRender();
            }
        }

        // 4. TIME AGO FORMATTER
        function formatTimeAgo(timestamp) {
            if (!timestamp) return "Just now";
            const now = Date.now();
            const diffMs = now - timestamp;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHrs = Math.floor(diffMin / 60);
            const diffDays = Math.floor(diffHrs / 24);

            if (diffMin < 1) return "Just now";
            if (diffMin === 1) return "1 min ago";
            if (diffMin < 60) return `${diffMin} mins ago`;
            if (diffHrs === 1) return "1 hour ago";
            if (diffHrs < 24) return `${diffHrs} hours ago`;
            if (diffDays === 1) return "24 hours ago";
            if (diffDays < 7) return `${diffDays} days ago`;
            return new Date(timestamp).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
        }

        // 5. RESOLVE ACTION BUTTON TEXT & URL
        function resolveButtonDetails(title, actionUrl) {
            let text = "View Now";
            let url = actionUrl || "index.html";
            const tLower = (title || "").toLowerCase();

            if (tLower.includes("darshan")) {
                text = "View Darshan";
                url = "darshan.html";
            } else if (tLower.includes("annadan") || tLower.includes("prasadam") || tLower.includes("contribute")) {
                text = "Contribute";
                url = "seva.html?cat=Annadan";
            } else if (tLower.includes("sanctum") || tLower.includes("progress") || tLower.includes("watch") || tLower.includes("video")) {
                text = "Watch";
                url = "progress.html";
            } else if (tLower.includes("brochure") || tLower.includes("scheme")) {
                text = "View Scheme";
                url = "media.html";
            } else if (tLower.includes("seva") || tLower.includes("puja") || tLower.includes("kartik") || tLower.includes("damodar")) {
                text = "Offer Seva";
                url = "seva.html";
            }

            return { text, url };
        }

        // 6. IMAGE MODAL PREVIEW
        function openImageModal(imgSrc, event) {
            if (event) event.stopPropagation();
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImage");
            if (modal && modalImg) {
                modalImg.src = imgSrc;
                modal.classList.add("active");
            }
        }

        function closeImageModal() {
            const modal = document.getElementById("imageModal");
            if (modal) modal.classList.remove("active");
        }

        function handleCardClick(notifId, targetUrl) {
            markNotificationAsRead(notifId);
            if (targetUrl) {
                window.location.href = targetUrl;
            }
        }

        // 7. CURRENT FILTER STATE
        let activeFilter = 'ALL'; // 'ALL', 'GURU', 'TEMPLE'
        window.masterNotificationPool = [];

        function setFilterMode(mode) {
            activeFilter = mode;
            document.getElementById("tabAll").classList.toggle("active", mode === 'ALL');
            document.getElementById("tabGuru").classList.toggle("active", mode === 'GURU');
            document.getElementById("tabTemple").classList.toggle("active", mode === 'TEMPLE');
            filterAndRender();
        }

        function filterAndRender() {
            let filtered = [...window.masterNotificationPool];
            if (activeFilter === 'GURU') {
                filtered = filtered.filter(n => n.isGuru === true);
            } else if (activeFilter === 'TEMPLE') {
                filtered = filtered.filter(n => n.isGuru !== true);
            }
            renderNotificationsList(filtered);
        }

        // 8. RENDER NOTIFICATIONS FEED (NO OM SIGN - 100% ISKCON LOGO / BELL)
        function renderNotificationsList(items) {
            const container = document.getElementById("notification-list");
            const badgeCount = document.getElementById("notifBadgeCount");
            const readIds = getReadNotificationIds();

            if (!items || items.length === 0) {
                if (badgeCount) badgeCount.innerHTML = `<i class="fas fa-bell-slash"></i> 0 Updates`;
                
                let emptyMsg = "Stay tuned for divine temple updates and sacred darshan broadcasts.";
                if (activeFilter === 'GURU') {
                    emptyMsg = "No personal messages from your revered Maharaj at the moment.";
                } else if (activeFilter === 'TEMPLE') {
                    emptyMsg = "No general temple broadcasts at the moment.";
                }

                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-bell-slash"></i></div>
                        <h4 style="font-weight: 800; font-size: 1rem; color: var(--text-500); margin: 0 0 6px 0;">No Notifications Yet</h4>
                        <p style="font-size: 0.8rem; color: var(--text-50); margin: 0;">${emptyMsg}</p>
                    </div>
                `;
                return;
            }

            if (badgeCount) {
                const unreadCount = items.filter(n => !readIds.includes(n.id)).length;
                badgeCount.innerHTML = `<i class="fas fa-bell"></i> ${unreadCount > 0 ? unreadCount + ' New' : items.length + ' Total'}`;
            }

            let html = "";
            items.forEach(item => {
                const isRead = readIds.includes(item.id);
                const timeText = formatTimeAgo(item.timestamp);
                const btnInfo = resolveButtonDetails(item.title, item.actionUrl);
                const hasImg = item.imageUrl && item.imageUrl.trim().startsWith('http');
                
                // ISKCON Icon: Guru photo, or logo.webp, never Om sign
                const avatarSrc = (item.avatarUrl && item.avatarUrl.trim().startsWith('http')) 
                    ? item.avatarUrl 
                    : (hasImg ? item.imageUrl : 'images/logo.webp');

                html += `
                    <div class="notif-card ${item.isGuru ? 'is-guru' : ''} ${!isRead ? 'unread' : ''}" onclick="handleCardClick('${item.id}', '${btnInfo.url}')">
                        ${!isRead ? '<div class="unread-indicator-dot" title="Unread"></div>' : ''}
                        
                        <div class="notif-avatar-box">
                            <img src="${avatarSrc}" class="notif-avatar" onerror="this.src='images/logo.webp'" alt="ISKCON Icon">
                        </div>
                        
                        <div class="notif-content">
                            <!-- Category Badge -->
                            ${item.isGuru 
                                ? `<span class="notif-tag tag-guru"><i class="fas fa-crown text-warning"></i> ${item.sender || 'Maharaj Blessings'}</span>`
                                : `<span class="notif-tag tag-temple"><i class="fas fa-gopuram text-primary"></i> ISKCON Temple Broadcast</span>`
                            }

                            <h3 class="notif-title">${item.title}</h3>
                            <p class="notif-desc">${item.body}</p>

                            <!-- Rich Banner Image -->
                            ${hasImg ? `
                                <div class="notif-media-container" onclick="openImageModal('${item.imageUrl}', event)">
                                    <img src="${item.imageUrl}" alt="${item.title}" loading="lazy" onerror="this.parentElement.style.display='none'">
                                </div>
                            ` : ''}

                            <div class="notif-action-row">
                                <a href="${btnInfo.url}" class="notif-btn" onclick="event.stopPropagation(); markNotificationAsRead('${item.id}');">${btnInfo.text}</a>
                                <span class="notif-time"><i class="far fa-clock"></i> ${timeText}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 9. REALTIME FIRESTORE SYNC (NO HARDCODED FAKE DEMO CLUTTER)
        let unsubscribeGlobal = null;
        let unsubscribeLeader = null;

        function refreshNotifications() {
            const container = document.getElementById("notification-list");
            container.innerHTML = `
                <div class="loader-box">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="font-size: 0.8rem; font-weight: 700; margin-top: 10px; color: var(--text-50);">Refreshing sacred updates...</p>
                </div>
            `;
            initRealtimeNotifications();
        }

        async function initRealtimeNotifications() {
            const installTimestamp = getDeviceInstallTimestamp();
            
            if (unsubscribeGlobal) unsubscribeGlobal();
            if (unsubscribeLeader) unsubscribeLeader();

            // Resolve connected leader strictly 10 digits
            let userLeaderId = "";
            let guruName = "Revered Maharaj";
            const rawProfile = localStorage.getItem("devoteeProfile");
            if (rawProfile) {
                try { 
                    const parsed = JSON.parse(rawProfile);
                    userLeaderId = String(parsed.assignedLeaderId || "").replace(/\D/g, '').slice(-10);
                    if (parsed.assignedLeaderName) guruName = parsed.assignedLeaderName;
                } catch(e){}
            }

            let liveBroadcasts = [];
            let leaderNotifs = [];

            function mergeAndStore() {
                const all = [...leaderNotifs, ...liveBroadcasts];
                const uniqueMap = new Map();
                all.forEach(item => uniqueMap.set(item.id, item));
                const finalList = Array.from(uniqueMap.values());
                
                // Sort chronologically (newest first)
                finalList.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                window.masterNotificationPool = finalList;
                filterAndRender();
            }

            try {
                // A. Real Global Temple Broadcasts (Ordered by sentAt, only recent real ones)
                unsubscribeGlobal = db.collection("global_broadcasts")
                    .orderBy("sentAt", "desc")
                    .limit(20)
                    .onSnapshot(snapshot => {
                        liveBroadcasts = [];
                        snapshot.forEach(doc => {
                            const data = doc.data();
                            const sent = data.sentAt || data.createdAt || Date.now();
                            // Filter out ancient history prior to install
                            if (sent >= (installTimestamp - 86400000)) { // 24h grace window
                                liveBroadcasts.push({
                                    id: doc.id,
                                    title: data.title || "Temple Update",
                                    body: data.body || "",
                                    actionUrl: data.actionUrl || "index.html",
                                    imageUrl: data.imageUrl || data.bannerUrl || "",
                                    avatarUrl: "images/logo.webp",
                                    timestamp: sent,
                                    isGuru: false,
                                    sender: data.sender || "Temple HQ"
                                });
                            }
                        });
                        mergeAndStore();
                    }, err => {
                        console.warn("Global broadcast listener warning:", err);
                    });

                // B. Real Targeted Guru / Maharaj Notifications (Only for HIS disciples!)
                if (userLeaderId) {
                    unsubscribeLeader = db.collection("targeted_notifications")
                        .where("leaderId", "in", [userLeaderId, "91" + userLeaderId, "+91" + userLeaderId])
                        .onSnapshot(snap => {
                            leaderNotifs = [];
                            snap.forEach(doc => {
                                const d = doc.data();
                                const created = d.sentAt || d.createdAt || Date.now();
                                if (created >= (installTimestamp - 86400000)) {
                                    leaderNotifs.push({
                                        id: doc.id,
                                        title: d.title || "Spiritual Message",
                                        body: d.body || "",
                                        actionUrl: d.actionUrl || "seva.html",
                                        imageUrl: d.imageUrl || "",
                                        avatarUrl: d.leaderPhoto || "images/guru_lokanath_swami.webp",
                                        timestamp: created,
                                        isGuru: true,
                                        sender: d.leaderName || guruName
                                    });
                                }
                            });
                            mergeAndStore();
                        }, err => {
                            console.warn("Targeted notifications listener warning:", err);
                        });
                } else {
                    mergeAndStore();
                }

            } catch (e) {
                console.error("Notification initialization error:", e);
                renderNotificationsList([]);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initRealtimeNotifications();
        });
    </script>
</body>
</html>
