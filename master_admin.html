<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#18181b">
    <title>Master SuperAdmin - ISKCON Bhuvaikuntha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #FFFDF9;
            --card-bg: #FFFFFF;
            --text-color: #18181b;
            --border-color: #18181b;
            --neu-border: 3px solid #18181b;
            --neu-shadow: 5px 5px 0px #18181b;
            --neu-shadow-sm: 3px 3px 0px #18181b;
            --neu-shadow-active: 1px 1px 0px #18181b;
            --badge-yellow: #FEF08A;
            --badge-orange: #FFD8A8;
            --badge-red: #FECDD3;
            --badge-green: #BBF7D0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-color);
            margin: 0;
            padding-bottom: 40px;
            -webkit-tap-highlight-color: transparent;
        }

        /* Neubrutal Top Nav */
        .master-nav {
            background: #18181b;
            color: #FFD54F;
            border-bottom: var(--neu-border);
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .neu-card {
            background: var(--card-bg);
            border: var(--neu-border);
            box-shadow: var(--neu-shadow);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .stat-card-box {
            background: #ffffff;
            border: 2.5px solid var(--border-color);
            box-shadow: var(--neu-shadow-sm);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .neu-input, .neu-select, .neu-textarea {
            width: 100%;
            padding: 11px 14px;
            background: #FFFDF9;
            border: 2.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 12px;
            outline: none;
            transition: all 0.15s ease;
        }
        .neu-input:focus, .neu-select:focus, .neu-textarea:focus {
            border-color: #FF9933;
            box-shadow: 3px 3px 0px #18181b;
        }

        .neu-btn {
            background: #FF9933;
            color: #18181b;
            border: var(--neu-border);
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 0.9rem;
            box-shadow: var(--neu-shadow-sm);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .neu-btn:active {
            transform: translate(2px, 2px);
            box-shadow: var(--neu-shadow-active);
        }

        .action-pill {
            padding: 6px 12px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 2px 2px 0px var(--border-color);
            transition: all 0.15s ease;
        }
        .action-pill:active { transform: translate(1px, 1px); box-shadow: none; }
        .pill-approve { background: var(--badge-green); color: #166534; }
        .pill-block { background: var(--badge-red); color: #991B1B; }

        .leader-item-card {
            background: #FFFDF9;
            border: 2.5px solid var(--border-color);
            box-shadow: var(--neu-shadow-sm);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* In-Page Auth Lock Modal (NO AUTOMATIC REDIRECT BUG) */
        .auth-lock-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(24, 24, 27, 0.96);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .auth-lock-card {
            background: #FFFDF9;
            border: var(--neu-border);
            box-shadow: 8px 8px 0px #FF9933;
            border-radius: 20px;
            padding: 26px 20px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- 🔒 IN-PAGE SMART MASTER PASSKEY GUARD (No redirect loop) -->
<div id="masterAuthModal" class="auth-lock-overlay">
    <div class="auth-lock-card">
        <div style="width:60px; height:60px; background:#FEF08A; border:3px solid #18181b; box-shadow:3px 3px 0 #18181b; border-radius:14px; margin:0 auto 14px auto; display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:#18181b;">
            <i class="fas fa-shield-halved"></i>
        </div>
        <h4 style="font-family:'Cinzel', serif; font-weight:900; margin:0 0 6px 0;">MASTER SUPERADMIN ACCESS</h4>
        <p style="font-size:0.8rem; font-weight:700; color:#52525b; margin-bottom:18px;">Enter Master Passkey to unlock this panel.</p>
        
        <div class="text-start">
            <label class="fw-bold small mb-1">Master User ID</label>
            <input type="text" id="mstAuthUser" class="neu-input" value="master_iskcon" placeholder="master_iskcon">

            <label class="fw-bold small mb-1">Master Secret Key</label>
            <input type="password" id="mstAuthPass" class="neu-input" placeholder="Enter Master Key" onkeypress="if(event.key==='Enter') unlockMasterPanel()">
            
            <div id="mstAuthError" class="alert alert-danger p-2 mb-2 d-none fw-bold small border border-2 border-dark">
                <i class="fas fa-triangle-exclamation me-1"></i> Invalid Master Credentials!
            </div>
            
            <button onclick="unlockMasterPanel()" class="neu-btn w-100 mt-1" style="background:#FFD54F;"><i class="fas fa-key me-1"></i> Unlock Master Dashboard</button>
        </div>
    </div>
</div>

<!-- TOP NAV -->
<div class="master-nav">
    <div class="d-flex align-items-center gap-2">
        <i class="fas fa-shield-halved fa-lg"></i>
        <h5 style="font-family:'Cinzel', serif; font-weight:900; margin:0; font-size:1.1rem;">MASTER SUPERADMIN</h5>
    </div>
    <div class="d-flex align-items-center gap-2">
        <a href="leader_admin.html" class="action-pill" style="background:#FEF08A; text-decoration:none; color:#18181b;"><i class="fas fa-crown"></i> Leader Panel</a>
        <button onclick="lockMasterPanel()" class="action-pill" style="background:#FECDD3;"><i class="fas fa-lock"></i> Lock</button>
    </div>
</div>

<div class="container-fluid px-3 pt-3">

    <!-- 1. Real-time Global Metrics -->
    <div class="neu-card" style="background: var(--badge-yellow);">
        <h5 style="font-family:'Cinzel', serif; font-weight:900; margin-bottom:14px;"><i class="fas fa-chart-pie me-2"></i> Global Mandir Analytics</h5>
        <div class="row g-2">
            <div class="col-4">
                <div class="stat-card-box">
                    <h3 style="font-weight:900; margin:0;" id="mstTotalLeaders">0</h3>
                    <small class="fw-bold">Leaders</small>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-card-box">
                    <h3 style="font-weight:900; margin:0;" id="mstTotalDevotees">0</h3>
                    <small class="fw-bold">Devotees</small>
                </div>
            </div>
            <div class="col-4">
                <div class="stat-card-box">
                    <h3 style="font-weight:900; margin:0; color:#16A34A;" id="mstTotalSeva">₹0</h3>
                    <small class="fw-bold">Total Seva</small>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. Create / Register New Leader (Maharaj) -->
    <div class="neu-card">
        <h5 style="font-family:'Cinzel', serif; font-weight:900; margin-bottom:14px;"><i class="fas fa-user-plus text-warning me-2"></i> Register New Leader / Maharaj</h5>
        
        <form onsubmit="handleCreateLeader(event)">
            <label class="fw-bold small mb-1">Leader Title & Name (e.g. HH Lokanath Swami Maharaj)</label>
            <input type="text" id="nl-name" class="neu-input" placeholder="HH Lokanath Swami Maharaj" required>
            
            <div class="row g-2">
                <div class="col-6">
                    <label class="fw-bold small mb-1">Leader Phone (Login ID)</label>
                    <input type="tel" id="nl-phone" class="neu-input" placeholder="10-digit mobile" required pattern="[0-9]{10}">
                </div>
                <div class="col-6">
                    <label class="fw-bold small mb-1">Leader Passkey</label>
                    <input type="text" id="nl-pass" class="neu-input" placeholder="e.g. Guru#108" required>
                </div>
            </div>

            <div class="row g-2">
                <div class="col-6">
                    <label class="fw-bold small mb-1">Country</label>
                    <input type="text" id="nl-country" class="neu-input" placeholder="India" required>
                </div>
                <div class="col-6">
                    <label class="fw-bold small mb-1">Base City</label>
                    <input type="text" id="nl-city" class="neu-input" placeholder="Pandharpur" required>
                </div>
            </div>

            <label class="fw-bold small mb-1">Photo URL (Optional)</label>
            <input type="url" id="nl-photo" class="neu-input" placeholder="https://i.ibb.co/hRvftDPj/images-5.jpg">

            <button type="submit" id="btnCreateLdr" class="neu-btn w-100 mt-2"><i class="fas fa-plus-circle me-1"></i> Register Leader & Approve</button>
        </form>
    </div>

    <!-- 3. Global Broadcast Notification -->
    <div class="neu-card">
        <h5 style="font-family:'Cinzel', serif; font-weight:900; margin-bottom:12px;"><i class="fas fa-tower-broadcast text-danger me-2"></i> Master Temple Push Broadcast</h5>
        <input type="text" id="mstBroadcastTitle" class="neu-input" placeholder="Title (e.g. Mega Darshan Live)">
        <textarea id="mstBroadcastBody" class="neu-textarea" rows="2" placeholder="Notification message for all devotees..."></textarea>
        <button onclick="sendGlobalBroadcast()" id="btnGlobalPush" class="neu-btn w-100" style="background:#FEF08A;"><i class="fas fa-bullhorn me-1"></i> Broadcast to All Users & Leaders</button>
    </div>

    <!-- 4. Leader Directory Management -->
    <div class="neu-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 style="font-family:'Cinzel', serif; font-weight:900; margin:0;"><i class="fas fa-crown text-warning me-2"></i> Leader Directory & Permissions</h5>
            <button onclick="loadAllLeadersMaster()" class="action-pill" style="background:#FFF;"><i class="fas fa-rotate"></i> Refresh</button>
        </div>

        <div id="masterLeadersContainer">
            <div class="text-center p-3"><i class="fas fa-spinner fa-spin fa-2x text-warning"></i></div>
        </div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAHksBlu9ue2p7AxXuUKALmEws5mscO908", 
        authDomain: "iskcon-bhuvaikuntha.firebaseapp.com", 
        projectId: "iskcon-bhuvaikuntha",
        storageBucket: "iskcon-bhuvaikuntha.firebasestorage.app",
        messagingSenderId: "87535383708",
        appId: "1:87535383708:web:7548e3b7d4c807faafe959"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Unlock Master Panel Logic
    window.unlockMasterPanel = function() {
        const u = document.getElementById("mstAuthUser").value.trim();
        const p = document.getElementById("mstAuthPass").value.trim();
        const err = document.getElementById("mstAuthError");

        if ((u === "master_iskcon" || u === "admin") && (p === "Bhuvaikuntha#108" || p === "iskcon108")) {
            localStorage.setItem("isMasterUnlocked", "true");
            document.getElementById("masterAuthModal").classList.add("d-none");
            loadAllLeadersMaster();
        } else {
            err.classList.remove("d-none");
        }
    };

    window.lockMasterPanel = function() {
        localStorage.removeItem("isMasterUnlocked");
        document.getElementById("mstAuthPass").value = "";
        document.getElementById("masterAuthModal").classList.remove("d-none");
    };

    // Auto unlock if previously authenticated on device
    if (localStorage.getItem("isMasterUnlocked") === "true") {
        document.getElementById("masterAuthModal").classList.add("d-none");
    }

    window.loadAllLeadersMaster = async function() {
        const container = document.getElementById("masterLeadersContainer");
        container.innerHTML = '<div class="text-center p-3"><i class="fas fa-spinner fa-spin fa-2x text-warning"></i></div>';

        try {
            const [leadersSnap, usersSnap, donsSnap] = await Promise.all([
                getDocs(collection(db, "leaders")),
                getDocs(collection(db, "users")),
                getDocs(collection(db, "donations"))
            ]);

            document.getElementById("mstTotalLeaders").innerText = leadersSnap.size;
            document.getElementById("mstTotalDevotees").innerText = usersSnap.size;

            let totalGlobalSeva = 0;
            donsSnap.forEach(d => { totalGlobalSeva += parseFloat(d.data().amount || 0); });
            document.getElementById("mstTotalSeva").innerText = `₹${totalGlobalSeva.toLocaleString('en-IN')}`;

            let html = '';
            leadersSnap.forEach(docSnap => {
                const ldr = docSnap.data();
                const id = docSnap.id;
                const isApproved = ldr.status === "approved";
                const isBlocked = ldr.status === "blocked";

                html += `
                    <div class="leader-item-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 style="font-weight:900; margin:0;">${ldr.name}</h6>
                                <p style="font-size:0.75rem; margin:2px 0 0 0; font-weight:700;">📞 Phone / ID: +91 ${id} | 🔑 Pass: ${ldr.passkey || 'N/A'}</p>
                                <p style="font-size:0.75rem; margin:0; font-weight:700; opacity:0.8;">📍 ${ldr.city}, ${ldr.country}</p>
                                <span class="badge ${isApproved ? 'bg-success' : (isBlocked ? 'bg-danger' : 'bg-warning text-dark')} mt-1">Status: ${(ldr.status || 'pending').toUpperCase()}</span>
                            </div>
                            <img src="${ldr.photoUrl || 'https://i.ibb.co/hRvftDPj/images-5.jpg'}" style="width:52px; height:52px; border-radius:10px; border:2px solid #18181b; object-fit:cover;">
                        </div>
                        <div class="d-flex gap-2 mt-2">
                            ${!isApproved ? `<button onclick="setLeaderStatus('${id}', 'approved')" class="action-pill pill-approve flex-grow-1"><i class="fas fa-check"></i> Approve</button>` : ''}
                            ${!isBlocked ? `<button onclick="setLeaderStatus('${id}', 'blocked')" class="action-pill pill-block flex-grow-1"><i class="fas fa-ban"></i> Block</button>` : `<button onclick="setLeaderStatus('${id}', 'approved')" class="action-pill pill-approve flex-grow-1"><i class="fas fa-unlock"></i> Unblock</button>`}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<p class="text-center fw-bold p-3">No Leaders registered yet.</p>';

        } catch(e) {
            container.innerHTML = '<p class="text-danger p-3 fw-bold">Error loading leaders data.</p>';
        }
    };

    window.handleCreateLeader = async function(e) {
        e.preventDefault();
        const btn = document.getElementById("btnCreateLdr");
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Registering...';

        const name = document.getElementById("nl-name").value.trim();
        const phone = document.getElementById("nl-phone").value.trim();
        const pass = document.getElementById("nl-pass").value.trim();
        const country = document.getElementById("nl-country").value.trim();
        const city = document.getElementById("nl-city").value.trim();
        const photo = document.getElementById("nl-photo").value.trim() || 'https://i.ibb.co/hRvftDPj/images-5.jpg';

        try {
            await setDoc(doc(db, "leaders", phone), {
                name: name,
                contact: phone,
                passkey: pass,
                country: country,
                city: city,
                photoUrl: photo,
                status: "approved",
                createdAt: Date.now()
            });

            alert(`✅ ${name} registered successfully!`);
            document.getElementById("nl-name").value = '';
            document.getElementById("nl-phone").value = '';
            document.getElementById("nl-pass").value = '';
            document.getElementById("nl-country").value = '';
            document.getElementById("nl-city").value = '';
            document.getElementById("nl-photo").value = '';
            loadAllLeadersMaster();
        } catch(err) {
            alert("Error registering leader.");
        }

        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-plus-circle me-1"></i> Register Leader & Approve';
    };

    window.setLeaderStatus = async function(id, status) {
        if (!confirm(`Change status to ${status.toUpperCase()}?`)) return;
        try {
            await updateDoc(doc(db, "leaders", id), { status: status });
            loadAllLeadersMaster();
        } catch(e) {
            alert("Status update failed.");
        }
    };

    window.sendGlobalBroadcast = async function() {
        const title = document.getElementById("mstBroadcastTitle").value.trim();
        const body = document.getElementById("mstBroadcastBody").value.trim();
        const btn = document.getElementById("btnGlobalPush");

        if(!title || !body) { alert("Enter both title and message."); return; }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Broadcasting...';

        try {
            await addDoc(collection(db, "global_broadcasts"), {
                title: title,
                body: body,
                sentAt: Date.now(),
                sender: "Master SuperAdmin"
            });
            alert("📢 Global broadcast sent to all devices!");
            document.getElementById("mstBroadcastTitle").value = '';
            document.getElementById("mstBroadcastBody").value = '';
        } catch(e) {
            alert("Broadcast error.");
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-bullhorn me-1"></i> Broadcast to All Users & Leaders';
    };

    if (localStorage.getItem("isMasterUnlocked") === "true") {
        loadAllLeadersMaster();
    }
</script>

</body>
</html>
