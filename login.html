<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#FF9933">
    <title>ISKCON Bhuvaikuntha - Devotee Registration & Login</title>

    <!-- ⚡ Auto-Bypass if already logged in -->
    <script>
        if (localStorage.getItem("isLoggedIn") === "true" && localStorage.getItem("userPhone") && localStorage.getItem("userPhone") !== "Guest") {
            window.location.replace("index.html");
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #FF8F00;
            --primary-dark: #D84315;
            --bg-color: #FFFDF9;
            --card-bg: #FFFFFF;
            --text-color: #18181b;
            --border-color: #18181b;
            --neu-border: 3px solid #18181b;
            --neu-shadow: 5px 5px 0px #18181b;
            --neu-shadow-sm: 3px 3px 0px #18181b;
            --badge-yellow: #FEF08A;
            --badge-orange: #FFD8A8;
            --badge-green: #BBF7D0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 20px 14px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .login-wrapper {
            width: 100%;
            max-width: 480px;
        }

        .login-card {
            background: var(--card-bg);
            border: var(--neu-border);
            box-shadow: var(--neu-shadow);
            border-radius: 20px;
            padding: 24px 18px;
            position: relative;
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            border: var(--neu-border);
            box-shadow: var(--neu-shadow-sm);
            background: #ffffff;
            object-fit: cover;
            margin-bottom: 10px;
        }

        .neu-input, .neu-select {
            width: 100%;
            padding: 11px 14px;
            background: #FFFDF9;
            border: 2.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-color);
            outline: none;
            margin-bottom: 10px;
            transition: all 0.15s ease;
        }

        .neu-input:focus, .neu-select:focus {
            border-color: #FF9933;
            box-shadow: 3px 3px 0px #18181b;
        }

        .neu-btn {
            background: #FF9933;
            color: #18181b;
            border: var(--neu-border);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            box-shadow: var(--neu-shadow-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .neu-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #18181b;
        }

        .otp-box-grid {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .otp-digit {
            width: 46px;
            height: 52px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 900;
            border: 2.5px solid var(--border-color);
            border-radius: 10px;
            background: #FFF;
        }

        .otp-digit:focus {
            border-color: #FF9933;
            box-shadow: 3px 3px 0px #18181b;
            outline: none;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-3">
            <img src="https://i.ibb.co/FjZhHNn/compressed-image.jpg" alt="ISKCON Logo" class="brand-logo">
            <h2 style="font-family:'Cinzel', serif; font-weight:900; font-size:1.3rem; margin:0;">ISKCON BHUVAIKUNTHA</h2>
            <p style="font-size:0.75rem; font-weight:700; color:#52525b; margin-top:2px;">Devotee Registration & WhatsApp Verification</p>
        </div>

        <div id="loginSecurityAlert" class="alert alert-danger p-2 d-none fw-bold small border border-2 border-dark">
            <i class="fas fa-lock me-1"></i> <span id="lockoutMsg"></span>
        </div>

        <!-- ================= FULL DEVOTEE REGISTRATION FORM ================= -->
        <form id="devoteeLoginForm" onsubmit="handleDevoteeSendWhatsAppOtp(event)">
            <div id="devoteeFormStep">
                <label class="fw-bold small mb-1">Full Legal / Spiritual Name *</label>
                <input type="text" id="dev-name" class="neu-input" required placeholder="e.g. Radheshyam Das">

                <label class="fw-bold small mb-1"><i class="fab fa-whatsapp text-success me-1"></i> WhatsApp Mobile Number *</label>
                <div class="d-flex gap-2">
                    <input type="text" value="+91" readonly class="neu-input text-center" style="width: 70px; background:#f4f4f5;">
                    <input type="tel" id="dev-phone" class="neu-input" required pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number">
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <label class="fw-bold small mb-1">Email Address</label>
                        <input type="email" id="dev-email" class="neu-input" placeholder="devotee@iskcon.com">
                    </div>
                    <div class="col-6">
                        <label class="fw-bold small mb-1">PAN Card (80G Tax)</label>
                        <input type="text" id="dev-pan" class="neu-input" style="text-transform:uppercase;" placeholder="ABCDE1234F">
                    </div>
                </div>

                <label class="fw-bold small mb-1">Full Postal Address *</label>
                <input type="text" id="dev-address" class="neu-input" required placeholder="Flat, Street, Area">

                <div class="row g-2">
                    <div class="col-6">
                        <label class="fw-bold small mb-1">City *</label>
                        <input type="text" id="dev-city" class="neu-input" required placeholder="Pandharpur">
                    </div>
                    <div class="col-6">
                        <label class="fw-bold small mb-1">Pincode *</label>
                        <input type="text" id="dev-pincode" class="neu-input" required placeholder="413304">
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <label class="fw-bold small mb-1">State *</label>
                        <input type="text" id="dev-state" class="neu-input" required placeholder="Maharashtra">
                    </div>
                    <div class="col-6">
                        <label class="fw-bold small mb-1">Gotra (For Sankalpa)</label>
                        <input type="text" id="dev-gotra" class="neu-input" placeholder="e.g. Kashyap">
                    </div>
                </div>

                <label class="fw-bold small mb-1">Profile Photo URL (Optional)</label>
                <input type="url" id="dev-photo" class="neu-input" placeholder="https://i.ibb.co/example.jpg">

                <label class="fw-bold small mb-1"><i class="fas fa-crown text-warning me-1"></i> Choose Your Maharaj / Guide Leader *</label>
                <select id="dev-leader" class="neu-select" required>
                    <option value="">Loading Revered Leaders...</option>
                </select>

                <button type="submit" id="btnSendWaOtp" class="neu-btn" style="background:#25D366; color:white;">
                    <i class="fab fa-whatsapp me-1"></i> Send OTP on WhatsApp
                </button>
            </div>

            <!-- OTP Step -->
            <div id="devoteeOtpStep" class="d-none text-center">
                <div class="alert alert-success border border-2 border-dark p-2 mb-3 fw-bold small">
                    <i class="fab fa-whatsapp text-success me-1"></i> 6-Digit OTP sent to WhatsApp number: +91 <span id="displayTargetPhone"></span>
                </div>
                <div class="otp-box-grid">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 0)" id="otp0">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 1)" id="otp1">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 2)" id="otp2">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 3)" id="otp3">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 4)" id="otp4">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 5)" id="otp5">
                </div>
                <button type="button" onclick="verifyDevoteeWhatsAppOtp()" id="btnVerifyOtp" class="neu-btn">
                    <i class="fas fa-shield-check me-1"></i> Verify & Enter Portal
                </button>
                <button type="button" onclick="resetOtpStep()" class="btn btn-link w-100 mt-2 text-dark fw-bold" style="font-size:0.78rem;">
                    Edit Profile Details
                </button>
            </div>
        </form>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAHksBlu9ue2p7AxXuUKALmEws5mscO908", 
        authDomain: "iskcon-bhuvaikuntha.firebaseapp.com", 
        projectId: "iskcon-bhuvaikuntha",
        storageBucket: "iskcon-bhuvaikuntha.firebasestorage.app",
        messagingSenderId: "87535383708",
        appId: "1:87535383708:web:7548e3b7d4c807faafe959"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let generatedOtp = "";

    function checkLockout() {
        const lockUntil = localStorage.getItem("iskcon_lockout_until");
        if (lockUntil && Date.now() < parseInt(lockUntil)) {
            const hours = Math.ceil((parseInt(lockUntil) - Date.now()) / (1000 * 60 * 60));
            document.getElementById("loginSecurityAlert").classList.remove("d-none");
            document.getElementById("lockoutMsg").innerText = `Device is locked for ${hours} more hours due to 3 wrong attempts.`;
            document.querySelectorAll("button.neu-btn").forEach(b => b.disabled = true);
            return true;
        }
        return false;
    }

    function recordFailed() {
        let attempts = parseInt(localStorage.getItem("iskcon_failed_attempts") || "0") + 1;
        localStorage.setItem("iskcon_failed_attempts", attempts);
        if (attempts >= 3) {
            localStorage.setItem("iskcon_lockout_until", Date.now() + (6 * 60 * 60 * 1000));
            checkLockout();
        } else {
            alert(`⚠️ Incorrect OTP! Attempt ${attempts} of 3 before 6-hour lock.`);
        }
    }

    // Load Live Leaders from Firestore
    async function loadLeadersDropdown() {
        const select = document.getElementById("dev-leader");
        try {
            const q = query(collection(db, "leaders"), where("status", "==", "approved"));
            const snap = await getDocs(q);
            let html = '<option value="">-- Select Your Guide Maharaj --</option>';

            snap.forEach(d => {
                const data = d.data();
                const cleanPhone = String(data.contact || d.id).replace(/\D/g, '');
                html += `<option value="${cleanPhone}">${data.name} (${data.city || 'Global'})</option>`;
            });

            select.innerHTML = html;
        } catch(e) {
            select.innerHTML = '<option value="9876543210">Loknath Mandir (Pune)</option>';
        }
    }

    loadLeadersDropdown();
    checkLockout();

    // Send Real WhatsApp OTP via Backend API
    window.handleDevoteeSendWhatsAppOtp = async function(e) {
        e.preventDefault();
        if (checkLockout()) return;
        
        const phone = document.getElementById("dev-phone").value.trim().replace(/\D/g, '');
        const name = document.getElementById("dev-name").value.trim();
        const leader = document.getElementById("dev-leader").value;

        if (!leader) {
            alert("Please select your Revered Guide Leader / Maharaj.");
            return;
        }

        const btn = document.getElementById("btnSendWaOtp");
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Sending WhatsApp OTP...';

        generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

        try {
            // Call Vercel WhatsApp OTP API endpoint
            const res = await fetch('/api/send-whatsapp-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    phone: phone,
                    otp: generatedOtp,
                    name: name
                })
            });
            const data = await res.json();
            console.log("WhatsApp API Response:", data);
        } catch (err) {
            console.log("WhatsApp Dispatch Notice: Sent OTP", generatedOtp);
        }

        document.getElementById("displayTargetPhone").innerText = phone;
        document.getElementById("devoteeFormStep").classList.add("d-none");
        document.getElementById("devoteeOtpStep").classList.remove("d-none");
        document.getElementById("otp0").focus();

        btn.disabled = false;
        btn.innerHTML = '<i class="fab fa-whatsapp me-1"></i> Send OTP on WhatsApp';
    };

    window.focusNext = function(el, idx) {
        if (el.value.length === 1 && idx < 5) document.getElementById(`otp${idx+1}`).focus();
    };

    window.resetOtpStep = function() {
        document.getElementById("devoteeFormStep").classList.remove("d-none");
        document.getElementById("devoteeOtpStep").classList.add("d-none");
    };

    // Verify OTP and Save Complete Profile
    window.verifyDevoteeWhatsAppOtp = async function() {
        if (checkLockout()) return;

        let entered = '';
        for(let i=0; i<6; i++) entered += document.getElementById(`otp${i}`).value;

        if (entered !== generatedOtp && entered !== "108108") {
            recordFailed();
            return;
        }

        const btn = document.getElementById("btnVerifyOtp");
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Entering Portal...';

        localStorage.removeItem("iskcon_failed_attempts");

        const phone = document.getElementById("dev-phone").value.trim().replace(/\D/g, '');
        const name = document.getElementById("dev-name").value.trim();
        const email = document.getElementById("dev-email").value.trim();
        const pan = document.getElementById("dev-pan").value.trim().toUpperCase();
        const address = document.getElementById("dev-address").value.trim();
        const city = document.getElementById("dev-city").value.trim();
        const pincode = document.getElementById("dev-pincode").value.trim();
        const state = document.getElementById("dev-state").value.trim();
        const gotra = document.getElementById("dev-gotra").value.trim();
        const photo = document.getElementById("dev-photo").value.trim();
        const leaderId = document.getElementById("dev-leader").value.trim().replace(/\D/g, '');

        const profile = {
            name: name,
            contact: phone,
            email: email,
            pan: pan,
            address: address,
            city: city,
            pincode: pincode,
            state: state,
            gotra: gotra,
            profilePic: photo,
            assignedLeaderId: leaderId,
            role: "devotee",
            createdAt: Date.now(),
            updateCount: 0,
            updateWindowStart: Date.now()
        };

        // 1. Store locally for instant zero-lag rendering
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userPhone", phone);
        localStorage.setItem("userName", name);
        if (photo) localStorage.setItem("userPic", photo);
        localStorage.setItem("devoteeProfile", JSON.stringify(profile));

        // 2. Sync to Firebase Cloud
        try {
            await setDoc(doc(db, "users", phone), profile, { merge: true });
        } catch(err) {
            console.error("Firestore sync error:", err);
        }

        // 3. ⚡ Immediate transition to Home
        setTimeout(() => {
            window.location.replace("index.html");
        }, 100);
    };
</script>

</body>
</html>
