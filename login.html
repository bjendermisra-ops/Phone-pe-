<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iskcon Bhuvaikuntha - Secure Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }, colors: { spiritual: { orange: '#FF7B00', gold: '#FFAE00', deepBlue: '#151b26', cardBg: '#1e2638' } } } } }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
    ::-webkit-scrollbar-thumb { background: #FF7B00; border-radius: 10px; }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gradient-to-tr from-[#151b26] via-[#232d3d] to-[#121620] text-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- SPLASH SCREEN -->
  <div id="splash-screen" class="fixed inset-0 bg-gradient-to-tr from-[#151b26] to-[#121620] z-50 flex flex-col items-center justify-center hidden">
    <div class="text-center space-y-6 fade-in">
      <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj70fNVH8m4Zrv5XknZAoDZFX3Sscp4j2QTVlw_eqUSBf1GiPw4NWEtDAXZT7IBRYpBpUwjUbs30xml-xjUPYGD0g2HoahOzWGmbdg8NQX32EVbfikjN-qXE-Zb7tfq_05M33U0MLfAlut6aBzIc4llEeGheO1c3IaKESopTDOKcd79AVHjapN56p7k7Gs/s512/1000272655.jpg" alt="ISKCON Logo" class="w-32 h-32 rounded-full border-4 border-spiritual-orange shadow-2xl mx-auto animate-pulse">
      <div class="space-y-2"><h1 class="text-2xl font-extrabold text-white tracking-wide uppercase">ISKCON BHUVAIKUNTHA</h1><p class="text-xs text-spiritual-gold font-bold uppercase tracking-widest">Jai Shree Krishna</p></div>
    </div>
  </div>

  <!-- MAIN CONSOLE CARD -->
  <div id="main-console" class="w-full max-w-lg bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl overflow-hidden transition-all duration-300">
    <div class="relative bg-gradient-to-r from-spiritual-orange to-spiritual-gold p-6 text-center overflow-hidden">
      <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj70fNVH8m4Zrv5XknZAoDZFX3Sscp4j2QTVlw_eqUSBf1GiPw4NWEtDAXZT7IBRYpBpUwjUbs30xml-xjUPYGD0g2HoahOzWGmbdg8NQX32EVbfikjN-qXE-Zb7tfq_05M33U0MLfAlut6aBzIc4llEeGheO1c3IaKESopTDOKcd79AVHjapN56p7k7Gs/s512/1000272655.jpg" alt="Logo" class="w-16 h-16 rounded-full border-2 border-white shadow-md mx-auto mb-3">
      <h2 class="text-xl font-extrabold tracking-wide uppercase text-white drop-shadow-sm">Iskcon Bhuvaikuntha</h2>
      <p class="text-xs text-white/90 font-medium tracking-wider uppercase mt-1">Devotee Dashboard</p>
    </div>

    <!-- TABS -->
    <div class="flex border-b border-white/10 bg-white/[0.02]">
      <button onclick="switchTab('signin')" id="tab-signin" class="w-1/2 py-4 text-sm font-bold tracking-wider uppercase border-b-2 border-spiritual-orange text-white"><i class="fa-solid fa-right-to-bracket mr-2"></i>Sign In</button>
      <button onclick="switchTab('signup')" id="tab-signup" class="w-1/2 py-4 text-sm font-bold tracking-wider uppercase border-b-2 border-transparent text-gray-400 hover:text-white"><i class="fa-solid fa-user-plus mr-2"></i>Sign Up</button>
    </div>

    <div class="p-6">
      <!-- SIGN IN TAB -->
      <div id="panel-signin" class="space-y-5 fade-in">
        <div class="text-center mb-1"><h3 class="text-base font-bold text-white">Log in using WhatsApp</h3></div>

        <div id="signin-step-send" class="space-y-4">
          <div class="space-y-2">
            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider">WhatsApp Number</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 font-bold text-sm">+91</div>
              <input type="tel" id="signin-phone" class="w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-sm text-white focus:outline-none focus:border-spiritual-orange" placeholder="Enter 10-digit number" required>
            </div>
          </div>
          <button onclick="sendSignInOtp()" id="signin-sendBtn" class="w-full bg-gradient-to-r from-spiritual-orange to-spiritual-gold text-white font-bold text-sm py-4 rounded-xl shadow-lg flex items-center justify-center gap-2"><i class="fa-brands fa-whatsapp text-base"></i> Send OTP on WhatsApp</button>
        </div>

        <div id="signin-step-verify" class="space-y-4 hidden">
          <div class="space-y-2">
            <div class="flex justify-between items-center"><label class="block text-xs font-bold text-gray-300 uppercase tracking-wider">Verification OTP Code</label><button onclick="resetSignInFlow()" class="text-xs text-spiritual-gold hover:underline font-semibold">Change Number</button></div>
            <input type="text" id="signin-otp" maxlength="4" class="w-full bg-white/5 border border-white/10 rounded-xl py-3.5 px-4 text-center text-lg font-bold tracking-[0.8em] text-white focus:outline-none focus:border-spiritual-orange" placeholder="••••" required>
          </div>
          <button onclick="verifySignInOtp()" id="signin-verifyBtn" class="w-full bg-emerald-500 text-white font-bold text-sm py-4 rounded-xl shadow-lg flex items-center justify-center gap-2"><i class="fa-solid fa-circle-check text-xs"></i> Verify & Login</button>
        </div>
      </div>

      <!-- SIGN UP TAB -->
      <div id="panel-signup" class="space-y-5 hidden fade-in">
        <div class="flex flex-col items-center justify-center space-y-3">
          <div class="relative group">
            <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white/10 bg-white/5 flex items-center justify-center shadow-lg relative">
              <img id="profile-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" class="w-full h-full object-cover">
            </div>
            <button type="button" onclick="document.getElementById('profile-file').click()" class="absolute bottom-0 right-0 w-8 h-8 bg-spiritual-orange text-white rounded-full flex items-center justify-center"><i class="fa-solid fa-camera text-xs"></i></button>
            <input type="file" id="profile-file" accept="image/*" class="hidden" onchange="handleProfilePictureUpload(this.files[0])">
          </div>
          <input type="hidden" id="profile-picture-url" value="">
        </div>

        <form id="signupForm" onsubmit="event.preventDefault(); processSignUp();" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1.5"><label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">Full Name *</label><input type="text" id="signup-fullname" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-spiritual-orange" placeholder="Enter Full Name" required></div>
            <div class="space-y-1.5"><label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">Email Address</label><input type="email" id="signup-email" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-spiritual-orange" placeholder="Enter Email"></div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1.5">
              <div class="flex justify-between items-center"><label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">Mobile Number *</label><span id="signup-verified-badge" class="hidden text-[10px] text-emerald-400 font-bold uppercase"><i class="fa-solid fa-circle-check"></i> Verified</span></div>
              <div class="flex gap-2">
                <div class="relative flex-1"><div class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 font-bold text-xs">+91</div><input type="tel" id="signup-phone" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pl-10 pr-2 text-xs text-white focus:outline-none focus:border-spiritual-orange" required></div>
                <button type="button" onclick="sendSignupOtp()" id="signup-send-otp-btn" class="bg-spiritual-orange text-white text-[10px] font-bold px-3 py-2 rounded-xl">Send OTP</button>
              </div>
            </div>
            <div class="space-y-1.5"><label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">Date of Birth *</label><input type="date" id="signup-dob" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-spiritual-orange" required></div>
          </div>

          <div id="signup-otp-container" class="hidden p-4 bg-white/[0.03] border border-white/10 rounded-2xl space-y-3 fade-in">
            <div class="flex gap-2"><input type="text" id="signup-otp-input" maxlength="4" class="flex-1 bg-white/5 border border-white/10 rounded-xl py-2 px-3 text-sm text-center font-bold tracking-[0.5em] text-white" placeholder="••••"><button type="button" onclick="verifySignupOtp()" class="bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-xl">Verify</button></div>
          </div>

          <div class="space-y-1.5"><label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">Address *</label><input type="text" id="signup-address" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-spiritual-orange" required></div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1.5"><label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">City *</label><input type="text" id="signup-city" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-spiritual-orange" required></div>
            <div class="space-y-1.5"><label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">PIN Code *</label><input type="text" id="signup-pincode" maxlength="6" class="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-spiritual-orange" required></div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1.5">
              <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">Country *</label>
              <select id="signup-country" onchange="loadDynamicStates(this.value)" class="w-full bg-spiritual-cardBg border border-white/10 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-spiritual-orange" required>
                <option value="" disabled selected>Select country</option><option value="India">India</option><option value="USA">USA</option>
              </select>
            </div>
            <div class="space-y-1.5">
              <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">State *</label>
              <select id="signup-state" class="w-full bg-spiritual-cardBg border border-white/10 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-spiritual-orange" required><option value="" disabled selected>Select state</option></select>
            </div>
          </div>

          <div class="space-y-1.5">
            <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider">Leader Name *</label>
            <select id="signup-leader" class="w-full bg-spiritual-cardBg border border-white/10 rounded-xl py-3 px-4 text-xs text-white focus:outline-none focus:border-spiritual-orange" required>
              <option value="" disabled selected>Select leader</option>
              <option value="His Holiness Radhanath Swami Maharaj">H.H. Radhanath Swami Maharaj</option>
            </select>
          </div>

          <button type="submit" id="signupBtn" disabled class="w-full bg-gradient-to-r from-spiritual-orange to-spiritual-gold text-white font-bold text-sm py-4 rounded-xl shadow-lg opacity-50 cursor-not-allowed"><i class="fa-solid fa-user-check"></i> Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 translate-y-[-50px] opacity-0 transition-all z-50 flex items-center gap-3 px-6 py-3.5 rounded-full shadow-2xl text-xs font-semibold text-white"><i id="toast-icon"></i><span id="toast-msg"></span></div>

  <script>
    // FIREBASE SETUP
    const firebaseConfig = {
      apiKey: "AIzaSyAHksBlu9ue2p7AxXuUKALmEws5mscO908",
      authDomain: "iskcon-bhuvaikuntha.firebaseapp.com",
      projectId: "iskcon-bhuvaikuntha",
      storageBucket: "iskcon-bhuvaikuntha.firebasestorage.app",
      messagingSenderId: "87535383708",
      appId: "1:87535383708:web:7548e3b7d4c807faafe959"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const imgbbApiKey = "548fb47d702b5ade3a1d6bea9c4b6461";
    
    // FULL HARDCODED URL FOR API (To prevent any relative path errors)
    const otpApiUrl = "https://phone-pe-pi.vercel.app/api/send-whatsapp-otp";

    let signinGeneratedOtp = "", signinPhoneNumber = "";
    let signupGeneratedOtp = "", signupPhoneNumber = "", signupVerified = false;

    window.addEventListener('load', () => {
      document.getElementById('signin-phone').addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10));
      document.getElementById('signup-phone').addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10));
    });

    function loadDynamicStates(country) {
      const stateSelect = document.getElementById('signup-state');
      stateSelect.innerHTML = '<option value="" disabled selected>Select state</option>';
      if(country==="India") { ["Maharashtra", "Delhi", "Gujarat", "Tamil Nadu"].forEach(s => stateSelect.innerHTML += `<option value="${s}">${s}</option>`); }
    }

    function switchTab(tab) {
      document.getElementById('panel-signin').classList.toggle('hidden', tab !== 'signin');
      document.getElementById('panel-signup').classList.toggle('hidden', tab !== 'signup');
      document.getElementById('tab-signin').className = `w-1/2 py-4 text-sm font-bold uppercase border-b-2 ${tab === 'signin' ? 'border-spiritual-orange text-white' : 'border-transparent text-gray-400'}`;
      document.getElementById('tab-signup').className = `w-1/2 py-4 text-sm font-bold uppercase border-b-2 ${tab === 'signup' ? 'border-spiritual-orange text-white' : 'border-transparent text-gray-400'}`;
    }

    // ================= SIGN IN LOGIC (WITH AGGRESSIVE ALERTS) =================
    async function sendSignInOtp() {
      const btn = document.getElementById('signin-sendBtn');
      try {
        const phoneInput = document.getElementById('signin-phone').value.replace(/\D/g, '');
        if (phoneInput.length !== 10) { alert("ERROR: Please enter a valid 10-digit number."); return; }
        
        signinPhoneNumber = "91" + phoneInput;
        btn.disabled = true; 
        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Checking Database...`;

        // 1. Check Firebase
        let docRef;
        try {
          docRef = await db.collection("users").doc(signinPhoneNumber).get();
        } catch (fbError) {
          alert("FIREBASE ERROR: \n" + fbError.message + "\n\n(Note: Agar ye permission error hai toh Firebase Rules allow read, write: if true; kardo)");
          throw fbError;
        }

        if (!docRef.exists) {
          alert("INFO: Account not found! Please Sign Up first.");
          switchTab('signup');
          return;
        }

        // 2. Call Vercel API
        signinGeneratedOtp = Math.floor(1000 + Math.random() * 9000).toString();
        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Sending OTP...`;

        try {
          const response = await fetch(otpApiUrl, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone: signinPhoneNumber, otp: signinGeneratedOtp })
          });
          
          const textData = await response.text();
          try {
            const data = JSON.parse(textData);
            if (data.status === 'success') {
              alert("SUCCESS: OTP sent on WhatsApp!");
              document.getElementById('signin-step-send').classList.add('hidden');
              document.getElementById('signin-step-verify').classList.remove('hidden');
            } else {
              alert("API ERROR: " + JSON.stringify(data));
            }
          } catch(e) {
            alert("SERVER CRASH: Vercel returned invalid data: \n" + textData);
          }
        } catch(apiError) {
          alert("NETWORK ERROR: Failed to connect to Vercel API.\n" + apiError.message);
        }

      } catch (err) {
        console.error(err);
      } finally {
        btn.disabled = false; btn.innerHTML = `<i class="fa-brands fa-whatsapp"></i> Send OTP on WhatsApp`;
      }
    }

    function verifySignInOtp() {
      const otpInput = document.getElementById('signin-otp').value.trim();
      if (otpInput !== signinGeneratedOtp) { alert("ERROR: Incorrect OTP!"); return; }
      
      alert("SUCCESS: Login Successful! Hari Bol!");
      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("userPhone", signinPhoneNumber);
      setTimeout(() => { window.location.href = "go:home"; }, 1000);
    }
    function resetSignInFlow() { document.getElementById('signin-step-verify').classList.add('hidden'); document.getElementById('signin-step-send').classList.remove('hidden'); }

    // ================= SIGN UP LOGIC (WITH AGGRESSIVE ALERTS) =================
    async function sendSignupOtp() {
      const btn = document.getElementById('signup-send-otp-btn');
      try {
        const phoneInput = document.getElementById('signup-phone').value.replace(/\D/g, '');
        if (phoneInput.length !== 10) { alert("ERROR: Valid 10-digit number required."); return; }
        
        signupPhoneNumber = "91" + phoneInput;
        btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i>`;

        // 1. Check Firebase
        let docRef;
        try {
          docRef = await db.collection("users").doc(signupPhoneNumber).get();
        } catch(fbError) {
          alert("FIREBASE ERROR: \n" + fbError.message);
          throw fbError;
        }

        if (docRef.exists) {
          alert("INFO: Account already exists! Please Sign In.");
          switchTab('signin');
          return;
        }

        // 2. Call Vercel API
        signupGeneratedOtp = Math.floor(1000 + Math.random() * 9000).toString();
        
        try {
          const response = await fetch(otpApiUrl, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone: signupPhoneNumber, otp: signupGeneratedOtp })
          });
          const textData = await response.text();
          try {
            const data = JSON.parse(textData);
            if (data.status === 'success') {
              alert("SUCCESS: OTP sent on WhatsApp!");
              document.getElementById('signup-otp-container').classList.remove('hidden');
            } else {
              alert("API ERROR: " + JSON.stringify(data));
            }
          } catch(e) {
            alert("SERVER CRASH: Vercel returned invalid data: \n" + textData);
          }
        } catch(apiError) {
          alert("NETWORK ERROR: " + apiError.message);
        }

      } catch (err) {
        console.error(err);
      } finally {
        btn.disabled = false; btn.innerHTML = `Send OTP`;
      }
    }

    function verifySignupOtp() {
      const otpInput = document.getElementById('signup-otp-input').value.trim();
      if (otpInput === signupGeneratedOtp) {
        signupVerified = true; alert("SUCCESS: Number Verified!");
        document.getElementById('signup-otp-container').classList.add('hidden');
        document.getElementById('signup-send-otp-btn').classList.add('hidden');
        document.getElementById('signup-verified-badge').classList.remove('hidden');
        document.getElementById('signupBtn').disabled = false;
        document.getElementById('signupBtn').classList.remove('opacity-50', 'cursor-not-allowed');
      } else alert("ERROR: Incorrect OTP");
    }

    async function processSignUp() {
      if (!signupVerified) { alert("ERROR: Please verify number first."); return; }
      const btn = document.getElementById('signupBtn');
      btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Saving...`;

      try {
        await db.collection("users").doc(signupPhoneNumber).set({
          name: document.getElementById('signup-fullname').value,
          email: document.getElementById('signup-email').value,
          phone: signupPhoneNumber,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        alert("SUCCESS: Account created! Welcome!");
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userPhone", signupPhoneNumber);
        setTimeout(() => { window.location.href = "go:home"; }, 1000);
      } catch (err) {
        alert("FIREBASE SAVE ERROR: " + err.message);
        btn.disabled = false; btn.innerHTML = `Create Account`;
      }
    }
  </script>
</body>
</html>
