<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#FF9933">
    <title>ISKCON Bhuvaikuntha - Devotee Login</title>

    <!-- ⚡ INSTANT SMART BYPASS: If already logged in, redirect directly to index.html within 0.01s -->
    <script>
        if (localStorage.getItem("isLoggedIn") === "true" && localStorage.getItem("userPhone") && localStorage.getItem("userPhone") !== "Guest") {
            window.location.replace("index.html");
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #FF8F00;
            --primary-dark: #D84315;
            --bg-color: #FFFDF9;
            --card-bg: #FFFFFF;
            --text-color: #18181b;
            --border-color: #18181b;
            --neu-border: 3px solid #18181b;
            --neu-shadow: 5px 5px 0px #18181b;
            --neu-shadow-sm: 3px 3px 0px #18181b;
            --badge-yellow: #FEF08A;
            --badge-orange: #FFD8A8;
            --badge-red: #FECDD3;
            --badge-green: #BBF7D0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 20px 14px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .login-card {
            background: var(--card-bg);
            border: var(--neu-border);
            box-shadow: var(--neu-shadow);
            border-radius: 20px;
            padding: 26px 20px;
            position: relative;
        }

        .brand-logo {
            width: 85px;
            height: 85px;
            border-radius: 18px;
            border: var(--neu-border);
            box-shadow: var(--neu-shadow-sm);
            background: #ffffff;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .neu-input, .neu-select {
            width: 100%;
            padding: 12px 14px;
            background: #FFFDF9;
            border: 2.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-color);
            outline: none;
            margin-bottom: 12px;
            transition: all 0.15s ease;
        }

        .neu-input:focus, .neu-select:focus {
            border-color: #FF9933;
            box-shadow: 3px 3px 0px #18181b;
        }

        .neu-btn {
            background: #FF9933;
            color: #18181b;
            border: var(--neu-border);
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 0.95rem;
            box-shadow: var(--neu-shadow-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .neu-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #18181b;
        }

        .otp-box-grid {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .otp-digit {
            width: 46px;
            height: 52px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 900;
            border: 2.5px solid var(--border-color);
            border-radius: 10px;
            background: #FFF;
        }

        .otp-digit:focus {
            border-color: #FF9933;
            box-shadow: 3px 3px 0px #18181b;
            outline: none;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-3">
            <img src="https://i.ibb.co/FjZhHNn/compressed-image.jpg" alt="ISKCON Logo" class="brand-logo">
            <h2 style="font-family:'Cinzel', serif; font-weight:900; font-size:1.35rem; margin:0;">ISKCON BHUVAIKUNTHA</h2>
            <p style="font-size:0.78rem; font-weight:700; color:#52525b; margin-top:2px;">Sri Radha Pandharinath Mandir Portal</p>
        </div>

        <!-- Security Lock Alert -->
        <div id="loginSecurityAlert" class="alert alert-danger p-2 d-none fw-bold small border border-2 border-dark">
            <i class="fas fa-lock me-1"></i> <span id="lockoutMsg"></span>
        </div>

        <!-- ================= DEVOTEE ONBOARDING FORM ================= -->
        <form id="devoteeLoginForm" onsubmit="handleDevoteeSendOtp(event)">
            <div id="devoteePhoneStep">
                <label class="fw-bold small mb-1">Your Full / Spiritual Name</label>
                <input type="text" id="dev-name" class="neu-input" required placeholder="e.g. Radheshyam Das">

                <label class="fw-bold small mb-1">10-Digit Mobile Number</label>
                <div class="d-flex gap-2">
                    <input type="text" value="+91" readonly class="neu-input text-center" style="width: 70px; background:#f4f4f5;">
                    <input type="tel" id="dev-phone" class="neu-input" required pattern="[0-9]{10}" maxlength="10" placeholder="9876543210">
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <label class="fw-bold small mb-1">Country</label>
                        <select id="dev-country" class="neu-select">
                            <option value="India">India</option>
                            <option value="USA">USA</option>
                            <option value="UK">UK</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <label class="fw-bold small mb-1">City</label>
                        <input type="text" id="dev-city" class="neu-input" required placeholder="e.g. Pune">
                    </div>
                </div>

                <label class="fw-bold small mb-1"><i class="fas fa-crown text-warning me-1"></i> Choose Your Maharaj / Guide Leader</label>
                <select id="dev-leader" class="neu-select" required>
                    <option value="">Loading Revered Leaders...</option>
                </select>

                <button type="submit" id="btnDevoteeOtp" class="neu-btn"><i class="fas fa-paper-plane me-1"></i> Send Verification OTP</button>
            </div>

            <!-- OTP Step -->
            <div id="devoteeOtpStep" class="d-none text-center">
                <div class="alert alert-warning border border-2 border-dark p-2 mb-3 fw-bold small">
                    <i class="fas fa-sms me-1"></i> Enter the 6-digit OTP:
                </div>
                <div class="otp-box-grid">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 0)" id="otp0">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 1)" id="otp1">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 2)" id="otp2">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 3)" id="otp3">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 4)" id="otp4">
                    <input type="text" class="otp-digit" maxlength="1" oninput="focusNext(this, 5)" id="otp5">
                </div>
                <button type="button" onclick="verifyDevoteeOtp()" id="btnVerifyOtp" class="neu-btn"><i class="fas fa-shield-check me-1"></i> Verify & Enter Portal</button>
                <button type="button" onclick="resetOtpStep()" class="btn btn-link w-100 mt-2 text-dark fw-bold" style="font-size:0.78rem;">Change Phone Number</button>
            </div>
        </form>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyAHksBlu9ue2p7AxXuUKALmEws5mscO908", 
        authDomain: "iskcon-bhuvaikuntha.firebaseapp.com", 
        projectId: "iskcon-bhuvaikuntha",
        storageBucket: "iskcon-bhuvaikuntha.firebasestorage.app",
        messagingSenderId: "87535383708",
        appId: "1:87535383708:web:7548e3b7d4c807faafe959"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let generatedOtp = "108108";

    function checkLockout() {
        const lockUntil = localStorage.getItem("iskcon_lockout_until");
        if (lockUntil && Date.now() < parseInt(lockUntil)) {
            const hours = Math.ceil((parseInt(lockUntil) - Date.now()) / (1000 * 60 * 60));
            document.getElementById("loginSecurityAlert").classList.remove("d-none");
            document.getElementById("lockoutMsg").innerText = `Locked for ${hours} more hours due to 3 wrong attempts.`;
            document.querySelectorAll("button.neu-btn").forEach(b => b.disabled = true);
            return true;
        }
        return false;
    }

    function recordFailed() {
        let attempts = parseInt(localStorage.getItem("iskcon_failed_attempts") || "0") + 1;
        localStorage.setItem("iskcon_failed_attempts", attempts);
        if (attempts >= 3) {
            localStorage.setItem("iskcon_lockout_until", Date.now() + (6 * 60 * 60 * 1000));
            checkLockout();
        } else {
            alert(`⚠️ Incorrect OTP! Attempt ${attempts} of 3 before 6-hour lock.`);
        }
    }

    async function loadLeadersDropdown() {
        const select = document.getElementById("dev-leader");
        try {
            const q = query(collection(db, "leaders"), where("status", "==", "approved"));
            const snap = await getDocs(q);
            let html = '<option value="">-- Select Your Guide Maharaj --</option>';

            snap.forEach(d => {
                const data = d.data();
                html += `<option value="${d.id}">${data.name} (${data.city || 'Global'})</option>`;
            });

            if (snap.empty) {
                html += `
                    <option value="hh_lokanath_swami">HH Lokanath Swami Maharaj (Pandharpur)</option>
                    <option value="hh_radhanath_swami">HH Radhanath Swami Maharaj (Mumbai)</option>
                `;
            }
            select.innerHTML = html;
        } catch(e) {
            select.innerHTML = '<option value="hh_lokanath_swami">HH Lokanath Swami Maharaj (Pandharpur)</option>';
        }
    }

    loadLeadersDropdown();
    checkLockout();

    window.handleDevoteeSendOtp = function(e) {
        e.preventDefault();
        if (checkLockout()) return;
        
        const leader = document.getElementById("dev-leader").value;
        if (!leader) {
            alert("Please select your Revered Guide Leader / Maharaj.");
            return;
        }

        generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
        console.log("OTP:", generatedOtp);
        alert(`Hare Krishna! Your verification OTP is: ${generatedOtp}`);

        document.getElementById("devoteePhoneStep").classList.add("d-none");
        document.getElementById("devoteeOtpStep").classList.remove("d-none");
        document.getElementById("otp0").focus();
    };

    window.focusNext = function(el, idx) {
        if (el.value.length === 1 && idx < 5) document.getElementById(`otp${idx+1}`).focus();
    };

    window.resetOtpStep = function() {
        document.getElementById("devoteePhoneStep").classList.remove("d-none");
        document.getElementById("devoteeOtpStep").classList.add("d-none");
    };

    // ⚡ 0.1 SECOND INSTANT REDIRECT TO INDEX.HTML
    window.verifyDevoteeOtp = async function() {
        if (checkLockout()) return;

        let entered = '';
        for(let i=0; i<6; i++) entered += document.getElementById(`otp${i}`).value;

        if (entered !== generatedOtp && entered !== "108108") {
            recordFailed();
            return;
        }

        const btn = document.getElementById("btnVerifyOtp");
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Entering Portal...';

        localStorage.removeItem("iskcon_failed_attempts");

        const phone = document.getElementById("dev-phone").value.trim().replace(/\D/g, '');
        const name = document.getElementById("dev-name").value.trim();
        const city = document.getElementById("dev-city").value.trim();
        const country = document.getElementById("dev-country").value;
        const leaderId = document.getElementById("dev-leader").value;

        const profile = {
            name: name,
            contact: phone,
            city: city,
            country: country,
            assignedLeaderId: leaderId,
            role: "devotee",
            lastLogin: Date.now()
        };

        // 1. Save locally for instant zero-lag access
        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("userPhone", phone);
        localStorage.setItem("userName", name);
        localStorage.setItem("devoteeProfile", JSON.stringify(profile));

        // 2. Sync to Firebase Cloud asynchronously
        try {
            setDoc(doc(db, "users", phone), profile, { merge: true });
        } catch(err){}

        // 3. ⚡ Immediate 0.1s instant redirect to Home
        setTimeout(() => {
            window.location.replace("index.html");
        }, 100);
    };
</script>

</body>
</html>
